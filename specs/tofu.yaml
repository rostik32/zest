# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: tofu
description: OpenTofu CLI
subcommands:
  - name: init
    description: Prepare your working directory for other commands
    options:
      - name: -upgrade
        description: Opt to upgrade modules and plugins as part of their respective installation steps
      - name: -lock
        description: Lock the state file when locking is supported. Defaults to true
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -force
        description: Delete the workspace even if its state is not empty. Defaults to false
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -lock-timeout
        description: Duration to retry a state lock. Default 0s
        args:
          name: seconds
        requiresSeparator: true
      - name: -input
        description: Ask for input for variables if not directly set
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -no-color
        description: Disables output with coloring
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: validate
    description: Check whether the configuration is valid
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: plan
    description: Show changes required by the current configuration
    options:
      - name: -compact-warnings
        description: If OpenTofu produces any warnings that are not accompanied by errors, show them in a more compact form that includes only the summary messages
      - name: -destroy
        description: If set, generates a plan to destroy all the known resources
      - name: -detailed-exitcode
        description: Return a detailed exit code when the command exits
      - name: -out
        description: The path to save the generated execution plan
        requiresSeparator: true
      - name: -parallelism
        description: Limit the number of concurrent operation as OpenTofu walks the graph. Defaults to 10
        args:
          name: number
      - name: -refresh
        description: Update the state prior to checking for differences
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -state
        description: Path to the state file. Defaults to 'tofu.tfstate'. Ignored when remote state is used
        args:
          template: filepaths
        requiresSeparator: true
      - name: -target
        displayName: -target=resource
        description: A Resource Address to target. This flag can be used multiple times
        isRepeatable: true
      - name: -var
        description: Set a variable in the OpenTofu configuration. This flag can be set multiple times
        insertValue: -var {cursor}
        args:
          name: foo=bar
        isRepeatable: true
      - name: -var-file
        description: Set variables in the OpenTofu configuration from a variable file
        args:
          template: filepaths
        requiresSeparator: true
      - name: -lock
        description: Lock the state file when locking is supported. Defaults to true
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -force
        description: Delete the workspace even if its state is not empty. Defaults to false
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -lock-timeout
        description: Duration to retry a state lock. Default 0s
        args:
          name: seconds
        requiresSeparator: true
      - name: -input
        description: Ask for input for variables if not directly set
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -no-color
        description: Disables output with coloring
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: apply
    description: Create or update infrastructure
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: destroy
    description: Destroy previously-created infrastructure
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: console
    description: Try OpenTofu expressions at an interactive command prompt
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: fmt
    description: Reformat your configuration in the standard style
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: force-unlock
    description: Release a stuck lock on the current workspace
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: get
    description: Install or upgrade remote OpenTofu modules
    options:
      - name: -update
        description: If specified, modules that are already downloaded will be checked for updates and the updates will be downloaded if present
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: graph
    description: Generate a Graphviz graph of the steps in an operation
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: import
    description: Associate existing infrastructure with an OpenTofu resource
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: login
    description: Obtain and save credentials for a remote host
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: logout
    description: Remove locally-stored credentials for a remote host
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: output
    description: Show output values from your root module
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: providers
    description: Show the providers required for this configuration
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: refresh
    description: Update the state to match remote systems
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: show
    description: Show the current state or a saved plan
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: state
    description: Advanced state management
  - name: taint
    description: Mark a resource instance as not fully functional
    options:
      - name: -allow-missing
        description: If specified, the command will succeed (exit code 0) even if the resource is missing. The command might still return an error for other situations, such as if there is a problem reading or writing the state
      - name: -lock
        description: Disables OpenTofu's default behavior of attempting to take a read/write lock on the state for the duration of the operation if set to false. Defaults to true
        args:
          name: true or false
          suggestions:
            - "true"
            - "false"
        requiresSeparator: true
      - name: -lock-timeout
        description: Unless locking is disabled with -lock=false, instructs OpenTofu to retry acquiring a lock for a period of time before returning an error. The duration syntax is a number followed by a time unit letter, such as 3s for three seconds
        args:
          name: seconds
        requiresSeparator: true
      - name: -ignore-remote-version
        description: When using the enhanced remote backend with OpenTofu Cloud, continue even if remote and local OpenTofu versions differ. This may result in an unusable OpenTofu Cloud workspace, and should be used with extreme caution
        args:
          name: seconds
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
    args:
      name: address
      generators:
        script:
          - tofu
          - state
          - list
        js:
          postProcess: 0
  - name: untaint
    description: Remove the 'tainted' state from a resource instance
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: workspace
    description: Workspace management
    subcommands:
      - name: new
        description: Create a new workspace
        insertValue: new '{cursor}'
        options:
          - name: -lock
            description: Lock the state file when locking is supported. Defaults to true
            args:
              name: true or false
              suggestions:
                - "true"
                - "false"
          - name: -lock-timeout
            description: Duration to retry a state lock. Default 0s
            args:
              name: seconds
          - name: -state
            description: Path to an existing state file to initialize the state of this environment
            args:
              name: path
              template: filepaths
            requiresSeparator: true
          - name: -help
            description: Show this help output, or the help for a specified subcommand
          - name: -chdir
            description: Switch to a different working directory before executing the given subcommand
            args:
              template: filepaths
            requiresSeparator: true
          - name: -version
            description: Show the current OpenTofu version
        args:
          name: workspace name
      - name: show
        description: Display the current workspace
        options:
          - name: -help
            description: Show this help output, or the help for a specified subcommand
          - name: -chdir
            description: Switch to a different working directory before executing the given subcommand
            args:
              template: filepaths
            requiresSeparator: true
          - name: -version
            description: Show the current OpenTofu version
      - name: list
        description: List the workspace
        options:
          - name: -help
            description: Show this help output, or the help for a specified subcommand
          - name: -chdir
            description: Switch to a different working directory before executing the given subcommand
            args:
              template: filepaths
            requiresSeparator: true
          - name: -version
            description: Show the current OpenTofu version
      - name: delete
        description: Delete the specified workspace
        options:
          - name: -lock
            description: Lock the state file when locking is supported. Defaults to true
            args:
              name: true or false
              suggestions:
                - "true"
                - "false"
            requiresSeparator: true
          - name: -force
            description: Delete the workspace even if its state is not empty. Defaults to false
            args:
              name: true or false
              suggestions:
                - "true"
                - "false"
            requiresSeparator: true
          - name: -lock-timeout
            description: Duration to retry a state lock. Default 0s
            args:
              name: seconds
            requiresSeparator: true
          - name: -input
            description: Ask for input for variables if not directly set
            args:
              name: true or false
              suggestions:
                - "true"
                - "false"
            requiresSeparator: true
          - name: -no-color
            description: Disables output with coloring
        args:
          name: workspace name
        generators:
          script:
            - tofu
            - workspace
            - list
          js:
            postProcess: 1
      - name: select
        description: Change the current working workspace
        args:
          generators:
            script:
              - tofu
              - workspace
              - list
            js:
              postProcess: 1
    options:
      - name: -help
        description: Show this help output, or the help for a specified subcommand
      - name: -chdir
        description: Switch to a different working directory before executing the given subcommand
        args:
          template: filepaths
        requiresSeparator: true
      - name: -version
        description: Show the current OpenTofu version
  - name: -install-autocomplete
    description: Install bash/zsh tab completion
  - name: -uninstall-autocomplete
    description: Uninstall bash/zsh tab completion
options:
  - name: -help
    description: Show this help output, or the help for a specified subcommand
  - name: -chdir
    description: Switch to a different working directory before executing the given subcommand
    args:
      template: filepaths
    requiresSeparator: true
  - name: -version
    description: Show the current OpenTofu version
parserDirectives:
  flagsArePosixNoncompliant: true
