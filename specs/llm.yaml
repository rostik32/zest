# yaml-language-server: $schema=https://raw.githubusercontent.com/rostik32/zest/main/schema/spec.schema.json
# llm. Generated with `zest gen` from docs/help.md (the --help of every command) in github.com/simonw/llm.
name: llm
description: Access large language models from the command line
subcommands:
- name: prompt
  description: Execute a prompt
  options:
  - name:
    - -s
    - --system
    description: System prompt to use
    args:
      name: TEXT
  - name:
    - -m
    - --model
    description: Model to use
    args:
      name: TEXT
  - name:
    - -d
    - --database
    description: Path to log database
    args:
      name: FILE
  - name:
    - -q
    - --query
    description: Use first model matching these strings
    args:
      name: TEXT
  - name:
    - -a
    - --attachment
    description: Attachment path or URL or -
    args:
      name: ATTACHMENT
  - name:
    - --at
    - --attachment-type
    description: Attachment with explicit mimetype, --at image.jpg image/jpeg
    args:
      name: TEXT TEXT
  - name:
    - -T
    - --tool
    description: Name of a tool to make available to the model
    args:
      name: TEXT
  - name: --functions
    description: Python code block or file path defining functions to register as tools
    args:
      name: TEXT
  - name:
    - --td
    - --tools-debug
    description: Show full details of tool executions
  - name:
    - --ta
    - --tools-approve
    description: Manually approve every tool execution
  - name:
    - --cl
    - --chain-limit
    description: How many chained tool responses to allow, default 5, set 0 for unlimited
    args:
      name: INTEGER
  - name:
    - -o
    - --option
    description: key/value options for the model
    args:
      name: TEXT TEXT
  - name: --options
    description: Show options for the selected model
  - name: --schema
    description: Schema DSL, JSON schema, filepath or ID
    args:
      name: TEXT
  - name: --schema-multi
    description: Schema for multiple results
    args:
      name: TEXT
  - name:
    - -f
    - --fragment
    description: Fragment (alias, URL, hash or file path) to add to the prompt
    args:
      name: TEXT
  - name:
    - --sf
    - --system-fragment
    description: Fragment to add to system prompt
    args:
      name: TEXT
  - name:
    - -t
    - --template
    description: Template to use; can be repeated to combine templates
    args:
      name: TEXT
  - name:
    - -p
    - --param
    description: Parameters for template
    args:
      name: TEXT TEXT
  - name: --no-stream
    description: Do not stream output
  - name:
    - -n
    - --no-log
    description: Don't log to database
  - name: --log
    description: Log prompt and response to the database
  - name:
    - -R
    - --hide-reasoning
    description: Hide reasoning output
  - name:
    - -c
    - --continue
    description: Continue the most recent conversation.
  - name:
    - --cid
    - --conversation
    description: Continue the conversation with the given ID.
    args:
      name: TEXT
  - name: --key
    description: API key to use
    args:
      name: TEXT
  - name: --save
    description: Save prompt with this template name
    args:
      name: TEXT
  - name: --async
    description: Run prompt asynchronously
  - name:
    - -u
    - --usage
    description: Show token usage
  - name:
    - -x
    - --extract
    description: Extract first fenced code block
  - name:
    - --xl
    - --extract-last
    description: Extract last fenced code block
  - name: --json
    description: Output the response as JSON, same format as llm logs --json
  - name:
    - -h
    - --help
    description: Show this message and exit.
- name: aliases
  description: Manage model aliases
  subcommands:
  - name: list
    description: List current aliases
    options:
    - name: --json
      description: Output as JSON
    - name:
