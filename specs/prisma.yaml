# yaml-language-server: $schema=https://raw.githubusercontent.com/rostik32/zest/main/schema/spec.schema.json
# Prisma ORM 7 CLI. Generated from apps/docs/content/docs/cli/v7 in github.com/prisma/docs.
name: prisma
description: Prisma ORM command line interface
options:
  - name: [-h, --help]
    description: Display help
  - name: [-v, --version]
    description: Print the Prisma version
subcommands:
  - name: "init"
    description: "Set up a new Prisma project in the current directory"
    options:
      - name: "--db"
        description: "Provision a fully managed Prisma Postgres database on the Prisma Data Platform"
      - name: "--datasource-provider"
        description: "Define the datasource provider: postgresql, mysql, sqlite, sqlserver, mongodb, or cockroachdb"
        args:
          name: "provider"
          suggestions: [postgresql, mysql, sqlite, sqlserver, mongodb, cockroachdb]
      - name: "--generator-provider"
        description: "Define the generator provider to use (default: prisma-client)"
        args:
          name: "provider"
      - name: "--preview-feature"
        description: "Define a preview feature to use (can be specified multiple times)"
      - name: "--output"
        description: "Define Prisma Client generator output path"
        args:
          name: "path"
          template: filepaths
      - name: "--url"
        description: "Define a custom datasource URL"
        args:
          name: "url"
  - name: "generate"
    description: "Generate artifacts like Prisma Client based on your Prisma schema"
    options:
      - name: "--config"
        description: "Custom path to your Prisma config file"
        args:
          name: "path"
          template: filepaths
      - name: "--schema"
        description: "Custom path to your Prisma schema"
        args:
          name: "path"
          template: filepaths
      - name: "--sql"
        description: "Generate typed SQL module"
      - name: "--watch"
        description: "Watch the Prisma schema and regenerate after changes"
      - name: "--generator"
        description: "Generator to use (can be provided multiple times)"
      - name: "--no-hints"
        description: "Hide hint messages (still outputs errors and warnings)"
      - name: "--require-models"
        description: "Do not allow generating a client without models"
  - name: "migrate"
    description: "Update your database schema with migrations"
    subcommands:
      - name: "deploy"
        description: "Apply pending migrations to update the database schema in production/staging"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--schema"
            description: "Custom path to your Prisma schema"
            args:
              name: "path"
              template: filepaths
      - name: "dev"
        description: "Create a migration from changes in Prisma schema, apply it to the database, and trigger generators"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--schema"
            description: "Custom path to your Prisma schema"
            args:
              name: "path"
              template: filepaths
          - name: "--url"
            description: "Override the datasource URL from the Prisma config file"
            args:
              name: "url"
          - name: ["-n", "--name"]
            description: "Name the migration"
            args:
              name: "name"
          - name: "--create-only"
            description: "Create a new migration but do not apply it"
      - name: "diff"
        description: "Compare the database schema from two arbitrary sources"
      - name: "reset"
        description: "Reset your database and apply all migrations. All data will be lost"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--schema"
            description: "Custom path to your Prisma schema"
            args:
              name: "path"
              template: filepaths
          - name: ["-f", "--force"]
            description: "Skip the confirmation prompt"
      - name: "resolve"
        description: "Resolve issues with database migrations in deployment databases"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--schema"
            description: "Custom path to your Prisma schema"
            args:
              name: "path"
              template: filepaths
          - name: "--applied"
            description: "Record a specific migration as applied"
            args:
              name: "migration"
              generators:
                script: "ls prisma/migrations 2>/dev/null | grep -v migration_lock"
          - name: "--rolled-back"
            description: "Record a specific migration as rolled back"
            args:
              name: "migration"
              generators:
                script: "ls prisma/migrations 2>/dev/null | grep -v migration_lock"
      - name: "status"
        description: "Check the status of your database migrations"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--schema"
            description: "Custom path to your Prisma schema"
            args:
              name: "path"
              template: filepaths
  - name: "db"
    description: "Manage your database schema and lifecycle during development"
    subcommands:
      - name: "execute"
        description: "Execute native commands to your database"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--file"
            description: "Path to a file containing the script to execute"
            args:
              name: "path"
              template: filepaths
      - name: "pull"
        description: "Pull the state from the database to the Prisma schema using introspection"
        options:
          - name: "--force"
            description: "Ignore current Prisma schema file"
          - name: "--print"
            description: "Print the introspected Prisma schema to stdout"
      - name: "push"
        description: "Push the state from your Prisma schema to your database"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--schema"
            description: "Custom path to your Prisma schema"
            args:
              name: "path"
              template: filepaths
          - name: "--url"
            description: "Override the datasource URL from the Prisma config file"
            args:
              name: "url"
          - name: "--accept-data-loss"
            description: "Ignore data loss warnings"
          - name: "--force-reset"
            description: "Force a reset of the database before push"
      - name: "seed"
        description: "Seed your database with test or initial data using custom scripts"
        options:
          - name: "--config"
            description: "Custom path to your Prisma config file"
            args:
              name: "path"
              template: filepaths
          - name: "--"
            description: "Pass custom arguments to the seed file"
  - name: "studio"
    description: "Browse and manage your database data with Prisma Studio web interface"
    options:
      - name: ["-p", "--port"]
        description: "Port number to start Studio on                       | 5555"
        args:
          name: "port"
      - name: ["-b", "--browser"]
        description: "Browser to auto-open Studio in                       | System default"
        args:
          name: "browser"
      - name: "--config"
        description: "Custom path to your Prisma config file               |"
        args:
          name: "path"
          template: filepaths
      - name: "--url"
        description: "Database connection string (overrides Prisma config) |"
        args:
          name: "url"
  - name: "format"
    description: "Format and validate your Prisma schema file with consistent structure"
    options:
      - name: "--config"
        description: "Custom path to your Prisma config file"
        args:
          name: "path"
          template: filepaths
      - name: "--schema"
        description: "Custom path to your Prisma schema"
        args:
          name: "path"
          template: filepaths
  - name: "validate"
    description: "Validate your Prisma schema for syntax errors and configuration issues"
    options:
      - name: "--config"
        description: "Custom path to your Prisma config file"
        args:
          name: "path"
          template: filepaths
      - name: "--schema"
        description: "Custom path to your Prisma schema"
        args:
          name: "path"
          template: filepaths
  - name: "version"
    description: "Display Prisma version information for CLI, Client, and engine binaries"
    options:
      - name: "--json"
        description: "Output version information in JSON format"
  - name: "debug"
    description: "Display Prisma debug information including schema paths, engine binaries, environment variables, and cache directories for troubleshooting"
    options:
      - name: "--config"
        description: "Custom path to your Prisma config file"
        args:
          name: "path"
          template: filepaths
      - name: "--schema"
        description: "Custom path to your Prisma schema"
        args:
          name: "path"
          template: filepaths
  - name: "dev"
    description: "Start a local Prisma Postgres server for development"
    options:
      - name: ["-n", "--name"]
        description: "Name of the server (helps isolate state between projects) | default"
        args:
          name: "name"
      - name: ["-p", "--port"]
        description: "Main port number the Prisma Dev server will listen on     | 51213"
        args:
          name: "port"
      - name: ["-P", "--db-port"]
        description: "Port number the database server will listen on            | 51214"
        args:
          name: "port"
      - name: "--shadow-db-port"
        description: "Port number the shadow database server will listen on     | 51215"
        args:
          name: "port"
      - name: ["-d", "--detach"]
        description: "Run the server in the background                          | false"
      - name: "--debug"
        description: "Enable debug logging                                      | false"
    subcommands:
      - name: "ls"
        description: "List available local Prisma Postgres servers"
        options:
          - name: "--debug"
            description: "Enable debug logging | false"
      - name: "rm"
        description: "Remove local Prisma Postgres servers"
        options:
          - name: "--debug"
            description: "Enable debug logging                          | false"
          - name: "--force"
            description: "Stop any running servers before removing them | false"
      - name: "start"
        description: "Start one or more stopped local Prisma Postgres servers"
        options:
          - name: "--debug"
            description: "Enable debug logging | false"
      - name: "stop"
        description: "Stop local Prisma Postgres servers"
        options:
          - name: "--debug"
            description: "Enable debug logging | false"
  - name: "console"
    description: "Prisma Data Platform commands"
    subcommands:
      - name: "status"
        description: "Show Prisma Data Platform service status"
        options:
          - name: "--json"
            description: "Output raw JSON from the status API"
