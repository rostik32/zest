# yaml-language-server: $schema=https://raw.githubusercontent.com/rostik32/zest/main/schema/spec.schema.json
# Starship. Written from src/main.rs and src/context/mod.rs in github.com/starship/starship.
name: starship
description: The minimal, blazing-fast, and infinitely customizable prompt for any shell
options:
  - name: [-h, --help]
    description: Print help
  - name: [-V, --version]
    description: Print version
subcommands:
  - name: init
    description: Print the shell function that runs starship
    args:
      name: shell
      suggestions: [zsh, bash, fish, powershell, nu, elvish, ion, tcsh, xonsh, cmd]
    options:
      - name: --print-full-init
        description: Print the main initialization script instead of the line that loads it
  - name: preset
    description: Print a preset config
    args:
      name: name
      isOptional: true
      suggestions:
        - bracketed-segments
        - catppuccin-powerline
        - gruvbox-rainbow
        - jetpack
        - nerd-font-symbols
        - no-empty-icons
        - no-nerd-font
        - no-runtime-versions
        - pastel-powerline
        - plain-text-symbols
        - pure-preset
        - tokyo-night
    options:
      - name: [-o, --output]
        description: Write the preset to a file instead of stdout
        args:
          name: file
          template: filepaths
      - name: [-f, --force]
        description: Overwrite the output file if it exists
      - name: [-l, --list]
        description: List all preset names
  - name: config
    description: Edit the starship configuration, or set one value
    args:
      - name: name
        description: Configuration key, e.g. character.success_symbol
        isOptional: true
      - name: value
        isOptional: true
  - name: print-config
    description: Print the computed starship configuration
    args:
      name: name
      description: Configuration keys to print
      isOptional: true
      isVariadic: true
    options:
      - name: [-d, --default]
        description: Print the default configuration instead of yours
  - name: toggle
    description: Toggle a module on or off
    args:
      - name: module
      - name: key
        description: "The key to toggle (default: disabled)"
        isOptional: true
  - name: module
    description: Print one prompt module
    args:
      name: module
      isOptional: true
    options:
      - name: [-l, --list]
        description: List the supported modules
      - &status
        name: [-s, --status]
        description: Exit status of the previous command
        args:
          name: code
      - &width
        name: [-w, --terminal-width]
        description: Width of the terminal
        args:
          name: columns
      - &path
        name: [-p, --path]
        description: The path the prompt should render for
        args:
          name: path
          template: folders
      - &duration
        name: [-d, --cmd-duration]
        description: Duration of the last command, in milliseconds
        args:
          name: ms
      - &keymap
        name: [-k, --keymap]
        description: Keymap of fish or zsh
        args:
          name: keymap
      - &jobs
        name: [-j, --jobs]
        description: Number of running jobs
        args:
          name: count
  - name: prompt
    description: Print the full prompt
    options:
      - name: --right
        description: Print the right prompt instead of the left one
      - name: --continuation
        description: Print the continuation prompt
      - name: --profile
        description: Print a profile from your config
        args:
          name: profile
      - *status
      - name: --pipestatus
        description: Exit codes of each command in the last pipeline
        args:
          name: codes
      - *width
      - *path
      - name: [-P, --logical-path]
        description: The logical path the prompt should render for
        args:
          name: path
          template: folders
      - *duration
      - *keymap
      - *jobs
      - name: --shlvl
        description: The current SHLVL
        args:
          name: level
  - name: explain
    description: Explain the modules shown in the current prompt
  - name: timings
    description: Print how long each active module took
  - name: session
    description: Generate a random session key
  - name: statusline
    description: Print the statusline of a profile
  - name: completions
    description: Print shell completions to stdout
    args:
      name: shell
      suggestions: [zsh, bash, fish, elvish, powershell, nushell]
  - name: bug-report
    description: Open a pre-filled GitHub issue with your configuration
  - name: config-schema
    description: Print the configuration's JSON schema
