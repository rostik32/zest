        options:
          - name: ["-r", "--revision"]
            description: "an optional revision to start at"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-T", "--template"]
            description: "Render each line using the given template"
            args:
              name: "template"
      - name: "chmod"
        description: "Sets or removes the executable bit for paths in the repo"
        args:
          - name: "mode"
            isOptional: true
          - name: "filesets"
            description: "Paths to change the executable bit for"
            isOptional: true
            template: filepaths
        options:
          - name: ["-r", "--revision"]
            description: "The revision to update"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
      - name: "delete"
        description: "Delete files from the given revision"
        args:
          - name: "filesets"
            description: "Files or directories to delete (filesets are accepted)"
            isOptional: true
            template: filepaths
        options:
          - name: ["-r", "--revision"]
            description: "The revision to delete the files in"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: "--restore-descendants"
            description: "Preserve the content (not the diff) when rebasing descendants"
      - name: "edit"
        description: "Edit the contents of a file in a revision"
        args:
          - name: "file"
            description: "The file to edit"
            isOptional: true
            template: filepaths
        options:
          - name: ["-r", "--revision"]
            description: "The revision to edit the file in"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: "--restore-descendants"
            description: "Preserve the content (not the diff) when rebasing descendants"
      - name: "list"
        description: "List files in a revision"
        args:
          - name: "filesets"
            description: "Only list files matching these prefixes (instead of all files)"
            isOptional: true
            template: filepaths
        options:
          - name: ["-r", "--revision"]
            description: "The revision to list files in"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-T", "--template"]
            description: "Render each file entry using the given template"
            args:
              name: "template"
      - name: "search"
        description: "Search for content in files"
        args:
          - name: "filesets"
            description: "Only search files matching these prefixes (instead of all files)"
            isOptional: true
            template: filepaths
        options:
          - name: ["-r", "--revision"]
            description: "The revision to search files in"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-p", "--pattern"]
            description: "The pattern to search for in a single line"
            args:
              name: "pattern"
          - name: "--name-only"
            description: "Print only the paths of files that contain a match, not the matched lines"
          - name: ["-n", "--line-number"]
            description: "Prefix each matched line with its 1-based line number within the file"
          - name: "--binary-as-text"
            description: "Treat binary files as text, matching and printing raw bytes even if they contain null bytes"
          - name: "--skip-binary"
            description: "Skip binary files entirely"
      - name: "show"
        description: "Print contents of files in a revision"
        args:
          - name: "filesets"
            description: "Paths to print"
            isOptional: true
            template: filepaths
        options:
          - name: ["-r", "--revision"]
            description: "The revision to get the file contents from"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-T", "--template"]
            description: "Render each file metadata using the given template"
            args:
              name: "template"
      - name: "track"
        description: "Start tracking specified paths in the working copy"
        args:
          - name: "filesets"
            description: "Paths to track"
            isOptional: true
            template: filepaths
        options:
          - name: "--include-ignored"
            description: "Track paths even if they're ignored or too large"
      - name: "untrack"
        description: "Stop tracking specified paths in the working copy"
        args:
          - name: "filesets"
            description: "Paths to untrack"
            isOptional: true
            template: filepaths
  - name: "fix"
    description: "Update files with formatting fixes or other changes"
    args:
      - name: "filesets"
        description: "Fix only these paths"
        isOptional: true
        template: filepaths
    options:
      - name: ["-s", "--source"]
        description: "Fix files in the specified revision(s) and their descendants"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: "--include-unchanged-files"
        description: "Fix unchanged files in addition to changed ones"
      - name: ["-a", "--all-lines"]
        description: "Format all lines instead of only modified lines"
  - name: "gerrit"
    description: "Interact with Gerrit Code Review"
    subcommands:
      - name: "upload"
        description: "Upload changes to Gerrit for code review, or update existing changes"
        options:
          - name: ["-r", "--revision"]
            description: "The revisions to upload to Gerrit"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-b", "--remote-branch"]
            description: "The location where your changes are intended to land"
            args:
              name: "remote_branch"
          - name: "--remote"
            description: "The Gerrit remote to push to"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
          - name: ["-n", "--dry-run"]
            description: "Only display what will change on the remote; do not push changes to Gerrit"
          - name: "--reviewer"
            description: "Add these emails as a reviewer (can be repeated)"
            args:
              name: "reviewer"
          - name: "--cc"
            description: "CC these emails on the change (can be repeated)"
            args:
              name: "cc"
          - name: ["-l", "--label"]
            description: "Add the following labels configured by Gerrit (can be repeated)"
            args:
              name: "label"
          - name: "--topic"
            description: "Apply a topic to the change"
            args:
              name: "topic"
          - name: "--hashtag"
            description: "Apply a hashtag to the change (can be repeated)"
            args:
              name: "hashtag"
          - name: ["-m", "--message"]
            description: "The description for the patch set"
            args:
              name: "message"
          - name: "--edit"
            description: "Push the change as a change edit"
          - name: "--wip"
            description: "Mark the change as WIP (work in progress)"
          - name: "--ready"
            description: "Mark the change as ready (no longer work in progress)"
          - name: "--private"
            description: "Mark the change as private"
          - name: "--remove-private"
            description: "Unmark the change as private"
          - name: "--publish-comments"
            description: "Publish draft comments for the given change"
          - name: "--no-publish-comments"
            description: "Do not publish draft comments for the given change"
          - name: "--notify"
            description: "Who to email notifications to (defaults to all)"
            args:
              name: "notify"
          - name: "--submit"
            description: "Directly submit the changes, bypassing code review"
          - name: "--skip-validation"
            description: "When --submit is provided, skip performing validations"
          - name: "--merged"
            description: "Create a new change, even if the change has already been merged"
          - name: "--ignore-attention-set"
            description: "Do not modify the attention set upon uploading"
          - name: "--deadline"
            description: "The deadline after which the push should be aborted"
            args:
              name: "deadline"
          - name: "--custom"
            description: "Send the following custom keyed values to Gerrit (can be repeated)"
            args:
              name: "custom"
          - name: ["-o", "--option"]
            description: "Send a git push -o option (can be repeated)"
            args:
              name: "option"
          - name: "--trace"
            description: "For debugging Gerrit"
            args:
              name: "trace"
  - name: "git"
    description: "Commands for working with Git remotes and the underlying Git repo"
    subcommands:
      - name: "clone"
        description: "Create a new repo backed by a clone of a Git repo"
        args:
          - name: "source"
            description: "URL or path of the Git repo to clone"
            isOptional: true
          - name: "destination"
            description: "Specifies the target directory for the Jujutsu repository clone"
            isOptional: true
        options:
          - name: "--remote"
            description: "Name of the newly created remote"
            args:
              name: "remote_name"
          - name: "--colocate"
            description: "Colocate the Jujutsu repo with the git repo"
          - name: "--no-colocate"
            description: "Disable colocation of the Jujutsu repo with the git repo"
          - name: "--depth"
            description: "Create a shallow clone of the given depth"
            args:
              name: "depth"
          - name: ["-b", "--branch"]
            description: "Name of the branch to fetch and use as the parent of the working-copy change (can be repeated)"
            args:
              name: "branch"
          - name: ["-t", "--tag"]
            description: "Fetch only some of the tags (can be repeated)"
            args:
              name: "tag"
          - name: "--object-hash"
            description: "Object hash algorithm for the local Git repository"
            args:
              name: "object_hash"
      - name: "colocation"
        description: "Manage Jujutsu repository colocation with Git"
        subcommands:
          - name: "disable"
            description: "Convert into a non-colocated Jujutsu/Git repository"
          - name: "enable"
            description: "Convert into a colocated Jujutsu/Git repository"
          - name: "status"
            description: "Show the current colocation status"
      - name: "export"
        description: "Update the underlying Git repo with changes made in the repo"
      - name: "fetch"
        description: "Fetch from a Git remote"
        options:
          - name: ["-b", "--branch"]
            description: "Name of the branch to fetch (can be repeated)"
            args:
              name: "branch"
          - name: ["-t", "--tag"]
            description: "Fetch only some of the tags (can be repeated)"
            args:
              name: "tag"
          - name: "--tracked"
            description: "Fetch only tracked bookmarks and tags"
          - name: "--remote"
            description: "The remote to fetch from (only named remotes are supported, can be repeated)"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
          - name: "--all-remotes"
            description: "Fetch from all remotes"
      - name: "import"
        description: "Update repo with changes made in the underlying Git repo"
      - name: "init"
        description: "Create a new Git backed repo"
        args:
          - name: "destination"
            description: "The destination directory where the jj repo will be created"
            isOptional: true
        options:
          - name: "--colocate"
            description: "Colocate the workspace of the Jujutsu repo with the Git repo"
          - name: "--no-colocate"
            description: "Disable colocation for the workspace of the Jujutsu repo with the Git repo"
          - name: "--object-hash"
            description: "Object hash algorithm for the newly created Git repository"
            args:
              name: "object_hash"
          - name: "--git-repo"
            description: "Specifies a path to an **existing** git repository to be used as the backing git repo for the newly created jj repo"
            args:
              name: "git_repo"
      - name: "push"
        description: "Push to a Git remote"
        options:
          - name: "--remote"
            description: "The remote(s) to push to (can be repeated)"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
          - name: ["-b", "--bookmark"]
            description: "Push only this bookmark, or bookmarks matching a pattern (can be repeated)"
            args:
              name: "bookmark"
              generators:
                script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
          - name: ["-t", "--tag"]
            description: "Push only this tag, or tags matching a pattern (can be repeated)"
            args:
              name: "tag"
          - name: "--all"
            description: "Push all bookmarks and tags (including new ones)"
          - name: "--tracked"
            description: "Push all tracked bookmarks and tags"
          - name: "--deleted"
            description: "Push all deleted bookmarks and tags"
          - name: "--allow-empty-description"
            description: "Allow pushing commits with empty descriptions"
          - name: "--allow-private"
            description: "Allow pushing commits that are private"
          - name: "--allow-conflicts"
            description: "Allow pushing commits that contain conflicts"
          - name: ["-r", "--revision"]
            description: "Push bookmarks and tags pointing to these commits (can be repeated)"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-c", "--change"]
            description: "Push this commit by creating a bookmark (can be repeated)"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: "--named"
            description: "Specify a new bookmark name and a revision to push under that name, e.g"
            args:
              name: "name=revision"
          - name: "--dry-run"
            description: "Only display what will change on the remote"
          - name: ["-o", "--option"]
            description: "Git push options"
            args:
              name: "option"
      - name: "remote"
        description: "Manage Git remotes"
        subcommands:
          - name: "add"
            description: "Add a Git remote"
            args:
              - name: "remote"
                description: "The remote's name"
                isOptional: true
                generators:
                  script: "jj git remote list 2>/dev/null | awk '{print $1}'"
              - name: "url"
                description: "The remote's URL or path"
                isOptional: true
            options:
              - name: "--push-url"
                description: "The URL used for push"
                args:
                  name: "push_url"
          - name: "list"
            description: "List Git remotes"
          - name: "remove"
            description: "Remove a Git remote and forget its bookmarks"
            args:
              - name: "remote"
                description: "The remote's name"
                isOptional: true
                generators:
                  script: "jj git remote list 2>/dev/null | awk '{print $1}'"
          - name: "rename"
            description: "Rename a Git remote"
            args:
              - name: "old"
                description: "The name of an existing remote"
                isOptional: true
              - name: "new"
                description: "The desired name for old"
                isOptional: true
          - name: "set-url"
            description: "Set the URL of a Git remote"
            args:
              - name: "remote"
                description: "The remote's name"
                isOptional: true
                generators:
                  script: "jj git remote list 2>/dev/null | awk '{print $1}'"
              - name: "url"
                description: "The URL or path to fetch from"
                isOptional: true
            options:
              - name: "--push"
                description: "The URL or path to push to"
                args:
                  name: "push"
              - name: "--fetch"
                description: "The URL or path to fetch from"
                args:
                  name: "fetch"
      - name: "root"
        description: "Show the underlying Git directory of a repository using the Git backend"
  - name: "help"
    description: "Print this message or the help of the given subcommand(s)"
    args:
      - name: "command"
        description: "Print help for the subcommand(s)"
        isOptional: true
    options:
      - name: ["-k", "--keyword"]
        description: "Show help for keywords instead of commands"
        args:
          name: "keyword"
  - name: "interdiff"
    description: "Show differences between the diffs of two revsets"
    args:
