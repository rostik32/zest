          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-f", "--from"]
        description: "Revision(s) to squash from (default: @ if -r isn't given)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-t", "--into"]
        description: "Revision to squash into (default: @ if -r isn't given)"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-o", "--onto"]
        description: "(Experimental) The revision(s) to use as parent for the new commit (can be repeated to create a merge commit)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-A", "--insert-after"]
        description: "(Experimental) The revision(s) to insert the new commit after (can be repeated to create a merge commit)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-B", "--insert-before"]
        description: "(Experimental) The revision(s) to insert the new commit before (can be repeated to create a merge commit)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-m", "--message"]
        description: "The description to use for the squashed revision (don't open editor)"
        args:
          name: "message"
      - name: ["-u", "--use-destination-message"]
        description: "Use the description of the destination revision and discard the description(s) of the source revision(s)"
      - name: "--editor"
        description: "Open an editor to edit the description of the squashed revision"
      - name: ["-i", "--interactive"]
        description: "Interactively choose which parts to squash"
      - name: "--tool"
        description: "The diff editor to use (implies --interactive)"
        args:
          name: "name"
          generators:
            script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: ["-k", "--keep-emptied"]
        description: "Do not abandon source revisions that become empty"
  - name: "status"
    description: "Show high-level repo status"
    args:
      - name: "filesets"
        description: "Restrict the status display to these paths"
        isOptional: true
        template: filepaths
  - name: "tag"
    description: "Manage tags"
    subcommands:
      - name: ["delete", "d"]
        description: "Delete existing tags"
        args:
          - name: "names"
            description: "Tag names to delete"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: ["list", "l"]
        description: "List tags and their targets"
        args:
          - name: "names"
            description: "Show tags whose local name matches"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-a", "--all-remotes"]
            description: "Show all tracked and untracked remote tags including the ones whose targets are synchronized with the local tags"
          - name: "--remote"
            description: "Show all tracked and untracked remote tags belonging to this remote"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
          - name: ["-t", "--tracked"]
            description: "Show tracked remote tags only"
          - name: ["-c", "--conflicted"]
            description: "Show conflicted tags only"
          - name: ["-r", "--revision"]
            description: "Show tags whose local targets are in the given revisions"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-T", "--template"]
            description: "Render each tag using the given template"
            args:
              name: "template"
          - name: "--sort"
            description: "Sort tags based on the given key (or multiple keys)"
            args:
              name: "sort_key"
      - name: ["set", "s"]
        description: "Create or update tags"
        args:
          - name: "names"
            description: "Tag names to create or update"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-r", "--revision"]
            description: "Target revision to point to"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: "--allow-move"
            description: "Allow moving existing tags"
      - name: "track"
        description: "Start tracking given remote tags"
        args:
          - name: "tag[@remote]"
            description: "Tag name patterns or remote tag symbols to track"
            isOptional: true
        options:
          - name: "--remote"
            description: "Remote names to track"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
      - name: "untrack"
        description: "Stop tracking given remote tags"
        args:
          - name: "tag[@remote]"
            description: "Tag name patterns or remote tag symbols to untrack"
            isOptional: true
        options:
          - name: "--remote"
            description: "Remote names to untrack"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
  - name: "undo"
    description: "Undo the last operation"
    options:
      - name: "--allow-cross-workspace"
        description: "Allow undoing an operation that was performed in another workspace"
  - name: "unsign"
    description: "Drop a cryptographic signature"
    options:
      - name: ["-r", "--revision"]
        description: "What revision(s) to unsign"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
  - name: "util"
    description: "Infrequently used commands such as for generating shell completions"
    subcommands:
      - name: "backend"
        description: "Commands relating to the backend used in the current repo"
        subcommands:
          - name: "name"
            description: "Print the name of the backend used in the current repo"
      - name: "completion"
        description: "Print a command-line-completion script"
        args:
          - name: "shell"
            isOptional: true
      - name: "config-schema"
        description: "Print the JSON schema for the jj TOML config format"
      - name: "diff"
        description: "Compare two files on disk"
        args:
          - name: "path1"
            description: "First path to compare"
            isOptional: true
            template: filepaths
          - name: "path2"
            description: "Second path to compare"
            isOptional: true
            template: filepaths
        options:
          - name: "--git"
            description: "Show a Git-format diff"
          - name: "--color-words"
            description: "Show a word-level diff with changes indicated only by color"
          - name: "--tool"
            description: "Generate diff by external command"
            args:
              name: "tool"
          - name: "--context"
            description: "Number of lines of context to show"
            args:
              name: "context"
          - name: ["-w", "--ignore-all-space"]
            description: "Ignore whitespace when comparing lines"
          - name: ["-b", "--ignore-space-change"]
            description: "Ignore changes in amount of whitespace when comparing lines"
      - name: "exec"
        description: "Execute an external command via jj"
        args:
          - name: "command"
            description: "External command to execute"
            isOptional: true
          - name: "args"
            description: "Arguments to pass to the external command"
            isOptional: true
      - name: "gc"
        description: "Run backend-dependent garbage collection"
        options:
          - name: "--expire"
            description: "Time threshold"
            args:
              name: "expire"
      - name: "install-man-pages"
        description: "Install Jujutsu's manpages to the provided path"
        args:
          - name: "path"
            description: "The path where manpages will installed"
            isOptional: true
            template: filepaths
      - name: "markdown-help"
        description: "Print the CLI help for all subcommands in Markdown"
      - name: "snapshot"
        description: "Snapshot the working copy if needed"
  - name: "version"
    description: "Display version information"
  - name: "workspace"
    description: "Commands for working with workspaces"
    subcommands:
      - name: "add"
        description: "Add a workspace"
        args:
          - name: "destination"
            description: "Where to create the new workspace"
            isOptional: true
        options:
          - name: "--name"
            description: "A name for the workspace"
            args:
              name: "name"
              generators:
                script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
          - name: ["-r", "--revision"]
            description: "A list of parent revisions for the working-copy commit of the newly created workspace"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-m", "--message"]
            description: "The change description to use"
            args:
              name: "message"
          - name: "--colocate"
            description: "Create a corresponding Git worktree for this workspace"
          - name: "--no-colocate"
            description: "Do not create a Git worktree for this workspace"
          - name: "--sparse-patterns"
            description: "How to handle sparse patterns when creating a new workspace"
            args:
              name: "sparse_patterns"
      - name: "forget"
        description: "Stop tracking a workspace's working-copy commit in the repo"
        args:
          - name: "workspaces"
            description: "Names of the workspaces to forget"
            isOptional: true
      - name: "list"
        description: "List workspaces"
        options:
          - name: ["-T", "--template"]
            description: "Render each workspace using the given template"
            args:
              name: "template"
      - name: "remove"
        description: "Remove a workspace and its working-copy files from disk"
        args:
          - name: "workspaces"
            description: "Names of the workspaces to remove"
            isOptional: true
      - name: "rename"
        description: "Renames the current workspace"
        args:
          - name: "new_workspace_name"
            description: "The name of the workspace to update to"
            isOptional: true
      - name: "root"
        description: "Show the workspace root directory"
        options:
          - name: "--name"
            description: "Name of the workspace (defaults to current)"
            args:
              name: "name"
              generators:
                script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: "update-stale"
        description: "Update a workspace that has become stale"
