# yaml-language-server: $schema=https://raw.githubusercontent.com/rostik32/zest/main/schema/spec.schema.json
# Jujutsu (jj). Generated from cli/tests/cli-reference@.md.snap in github.com/jj-vcs/jj.
name: jj
description: "Jujutsu, a Git-compatible version control system"
options:
  - name: ["-R", "--repository"]
    description: "Path to repository to operate on"
    args:
      name: "repository"
  - name: "--ignore-working-copy"
    description: "Don't snapshot the working copy, and don't update it"
  - name: "--no-integrate-operation"
    description: "Run the command as usual but don't integrate any operations"
  - name: "--ignore-immutable"
    description: "Allow rewriting immutable commits"
  - name: "--at-operation"
    description: "Operation to load the repo at"
    args:
      name: "at_operation"
  - name: "--debug"
    description: "Enable debug logging"
  - name: "--color"
    description: "When to colorize output"
    args:
      name: "when"
  - name: "--quiet"
    description: "Silence non-primary command output"
  - name: "--no-pager"
    description: "Disable the pager"
  - name: "--config"
    description: "Additional configuration options (can be repeated)"
    args:
      name: "name=value"
  - name: "--config-file"
    description: "Additional configuration files (can be repeated)"
    args:
      name: "path"
      template: filepaths
subcommands:
  - name: "abandon"
    description: "Abandon a revision"
    args:
      - name: "revsets"
        description: "The revision(s) to abandon (default: @)"
        isOptional: true
        isVariadic: true
        generators:
          script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
          descriptionSeparator: "	"
    options:
      - name: "--retain-bookmarks"
        description: "Do not delete bookmarks pointing to the revisions to abandon"
      - name: "--restore-descendants"
        description: "Do not modify the content of the children of the abandoned commits"
  - name: "absorb"
    description: "Move changes from a revision into the stack of mutable revisions"
    args:
      - name: "filesets"
        description: "Move only changes to these paths (instead of all paths)"
        isOptional: true
        template: filepaths
    options:
      - name: ["-f", "--from"]
        description: "Source revision to absorb from"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-t", "--into"]
        description: "Destination revisions to absorb into"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-i", "--interactive"]
        description: "Interactively choose which parts to absorb"
      - name: "--tool"
        description: "Specify diff editor to be used (implies --interactive)"
        args:
          name: "name"
          generators:
            script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
  - name: "arrange"
    description: "Interactively arrange the commit graph"
    args:
      - name: "revsets"
        description: "The revisions to arrange"
        isOptional: true
        generators:
          script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
          descriptionSeparator: "	"
  - name: "bisect"
    description: "Find a bad revision by bisection"
    subcommands:
      - name: "run"
        description: "Run a given command to find the first bad revision"
        args:
          - name: "command"
            description: "Command to run to determine the status of a revision"
            isOptional: true
          - name: "args"
            description: "Arguments to pass to the command"
            isOptional: true
        options:
          - name: ["-r", "--range"]
            description: "Range of revisions to bisect (can be repeated)"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: "--find-good"
            description: "Find the first good revision instead"
          - name: "--trust-endpoints"
            description: "Skip the pre-bisection checks"
  - name: "bookmark"
    description: "Manage bookmarks"
    subcommands:
      - name: ["advance", "a"]
        description: "Advance the closest bookmarks to a target revision"
        args:
          - name: "names"
            description: "Move bookmarks matching the given name patterns"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-t", "--to"]
            description: "Move bookmarks to this revision"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
      - name: ["create", "c"]
        description: "Create a new bookmark"
        args:
          - name: "names"
            description: "The bookmarks to create"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-r", "--revision"]
            description: "The bookmark's target revision"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
      - name: ["delete", "d"]
        description: "Delete an existing bookmark and propagate the deletion to remotes on the next push"
        args:
          - name: "names"
            description: "The bookmarks to delete"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: ["forget", "f"]
        description: "Forget a bookmark without marking it as a deletion to be pushed"
        args:
          - name: "names"
            description: "The bookmarks to forget"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: "--include-remotes"
            description: "When forgetting a local bookmark, also forget any corresponding remote bookmarks"
      - name: ["list", "l"]
        description: "List bookmarks and their targets"
        args:
          - name: "names"
            description: "Show bookmarks whose local name matches"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-a", "--all-remotes"]
            description: "Show all tracked and untracked remote bookmarks including the ones whose targets are synchronized with the local bookmarks"
          - name: "--remote"
            description: "Show all tracked and untracked remote bookmarks belonging to this remote"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
          - name: ["-t", "--tracked"]
            description: "Show tracked remote bookmarks only"
          - name: ["-c", "--conflicted"]
            description: "Show conflicted bookmarks only"
          - name: ["-r", "--revision"]
            description: "Show bookmarks whose local targets are in the given revisions"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-T", "--template"]
            description: "Render each bookmark using the given template"
            args:
              name: "template"
          - name: "--sort"
            description: "Sort bookmarks based on the given key (or multiple keys)"
            args:
              name: "sort_key"
      - name: ["move", "m"]
        description: "Move existing bookmarks to target revision"
        args:
          - name: "names"
            description: "Move bookmarks matching the given name patterns"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-f", "--from"]
            description: "Move bookmarks from the given revisions"
            args:
              name: "revsets"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-t", "--to"]
            description: "Move bookmarks to this revision"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-B", "--allow-backwards"]
            description: "Allow moving bookmarks backwards or sideways"
      - name: ["rename", "r"]
        description: "Rename old bookmark name to new bookmark name"
        args:
          - name: "old"
            description: "The old name of the bookmark"
            isOptional: true
          - name: "new"
            description: "The new name of the bookmark"
            isOptional: true
        options:
          - name: "--overwrite-existing"
            description: "Allow renaming even if the new bookmark name already exists"
      - name: ["set", "s"]
        description: "Create a new bookmark, or update an existing one by name"
        args:
          - name: "names"
            description: "The bookmarks to update"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: ["-r", "--revision"]
            description: "The bookmark's target revision"
            args:
              name: "revset"
              generators:
                script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
                descriptionSeparator: "	"
          - name: ["-B", "--allow-backwards"]
            description: "Allow moving the bookmark backwards or sideways"
      - name: ["track", "t"]
        description: "Start tracking given remote bookmarks"
        args:
          - name: "bookmark[@remote]"
            description: "Bookmark name patterns or remote bookmark symbols to track"
            isOptional: true
        options:
          - name: "--remote"
            description: "Remote names to track"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
      - name: "untrack"
        description: "Stop tracking given remote bookmarks"
        args:
          - name: "bookmark[@remote]"
            description: "Bookmark name patterns or remote bookmark symbols to untrack"
            isOptional: true
        options:
          - name: "--remote"
            description: "Remote names to untrack"
            args:
              name: "remote"
              generators:
                script: "jj git remote list 2>/dev/null | awk '{print $1}'"
  - name: "commit"
    description: "Update the description and create a new change on top"
    args:
      - name: "filesets"
        description: "Put these paths in the current commit"
        isOptional: true
        template: filepaths
    options:
      - name: ["-i", "--interactive"]
        description: "Interactively choose which changes to include in the current commit"
      - name: "--tool"
        description: "Specify diff editor to be used (implies --interactive)"
        args:
          name: "name"
          generators:
            script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: ["-m", "--message"]
        description: "The change description to use (don't open editor)"
        args:
          name: "message"
      - name: "--editor"
        description: "Open an editor to edit the change description"
  - name: "config"
    description: "Manage config options"
    subcommands:
      - name: ["edit", "e"]
        description: "Start an editor on a jj config file"
        options:
          - name: "--user"
            description: "Target the user-level config"
          - name: "--repo"
            description: "Target the repo-level config"
          - name: "--workspace"
            description: "Target the workspace-level config"
          - name: "--file"
            description: "Target the config file specified by the given path"
            args:
              name: "path"
              template: filepaths
      - name: "gc"
        description: "Find and optionally delete repo and workspace config directories whose paths no longer exist"
      - name: ["get", "g"]
        description: "Get the value of a given config option"
        args:
          - name: "name"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: ["list", "l"]
        description: "List variables set in config files, along with their values"
        args:
          - name: "name"
            description: "An optional name of a specific config option to look up"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: "--include-defaults"
            description: "Whether to explicitly include built-in default values in the list"
          - name: "--include-overridden"
            description: "Allow printing overridden values"
          - name: "--user"
            description: "Target the user-level config"
          - name: "--repo"
            description: "Target the repo-level config"
          - name: "--workspace"
            description: "Target the workspace-level config"
          - name: ["-T", "--template"]
            description: "Render each variable using the given template"
            args:
              name: "template"
      - name: ["path", "p"]
        description: "Print the paths to the config files"
        options:
          - name: "--user"
            description: "Target the user-level config"
          - name: "--repo"
            description: "Target the repo-level config"
          - name: "--workspace"
            description: "Target the workspace-level config"
      - name: ["set", "s"]
        description: "Update a config file to set the given option to a given value"
        args:
          - name: "name"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
          - name: "value"
            description: "New value to set"
            isOptional: true
        options:
          - name: "--user"
            description: "Target the user-level config"
          - name: "--repo"
            description: "Target the repo-level config"
          - name: "--workspace"
            description: "Target the workspace-level config"
          - name: "--file"
            description: "Target the config file specified by the given path"
            args:
              name: "path"
              template: filepaths
      - name: ["unset", "u"]
        description: "Update a config file to unset the given option"
        args:
          - name: "name"
            isOptional: true
            generators:
              script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
        options:
          - name: "--user"
            description: "Target the user-level config"
          - name: "--repo"
            description: "Target the repo-level config"
          - name: "--workspace"
            description: "Target the workspace-level config"
          - name: "--file"
            description: "Target the config file specified by the given path"
            args:
              name: "path"
              template: filepaths
  - name: "converge"
    description: "Converge divergent changes"
    options:
      - name: ["-r", "--revision"]
        description: "The search space to look for divergent revisions"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: "--no-interactive"
        description: "Do not prompt the user for help resolving divergence"
  - name: "describe"
    description: "Update the change description or other metadata"
    args:
      - name: "revsets"
        description: "The revision(s) whose description to edit (default: @)"
        isOptional: true
        isVariadic: true
        generators:
          script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
          descriptionSeparator: "	"
    options:
      - name: ["-m", "--message"]
        description: "The change description to use (don't open editor)"
        args:
          name: "message"
      - name: "--stdin"
        description: "Read the change description from stdin"
      - name: "--editor"
        description: "Open an editor to edit the change description"
  - name: "diff"
    description: "Compare file contents between two revisions"
    args:
      - name: "filesets"
        description: "Restrict the diff to these paths"
        isOptional: true
        template: filepaths
    options:
      - name: ["-r", "--revisions"]
        description: "Show changes in these revisions"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-f", "--from"]
        description: "Show changes from this revision"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-t", "--to"]
        description: "Show changes to this revision"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-T", "--template"]
        description: "Render each file diff entry using the given template"
        args:
          name: "template"
      - name: ["-s", "--summary"]
        description: "For each path, show only whether it was modified, added, or deleted"
      - name: "--stat"
        description: "Show a histogram of the changes"
      - name: "--types"
        description: "For each path, show only its type before and after"
      - name: "--name-only"
        description: "For each path, show only its path"
      - name: "--git"
        description: "Show a Git-format diff"
      - name: "--color-words"
        description: "Show a word-level diff with changes indicated only by color"
      - name: "--tool"
        description: "Generate diff by external command"
        args:
          name: "tool"
      - name: "--context"
        description: "Number of lines of context to show"
        args:
          name: "context"
      - name: ["-w", "--ignore-all-space"]
        description: "Ignore whitespace when comparing lines"
      - name: ["-b", "--ignore-space-change"]
        description: "Ignore changes in amount of whitespace when comparing lines"
  - name: "diffedit"
    description: "Touch up the content changes in a revision with a diff editor"
    args:
      - name: "filesets"
        description: "Edit only these paths (unmatched paths will remain unchanged)"
        isOptional: true
        template: filepaths
    options:
      - name: ["-r", "--revision"]
        description: "The revision to touch up"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-f", "--from"]
        description: "Show changes from this revision"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-t", "--to"]
        description: "Edit changes in this revision"
        args:
          name: "revset"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: "--tool"
        description: "Specify diff editor to be used"
        args:
          name: "name"
          generators:
            script: "jj bookmark list --quiet -T 'name ++ \"\\n\"' 2>/dev/null"
      - name: "--restore-descendants"
        description: "Preserve the content (not the diff) when rebasing descendants"
  - name: "duplicate"
    description: "Create new changes with the same content as existing ones"
    args:
      - name: "revsets"
        description: "The revision(s) to duplicate (default: @)"
        isOptional: true
        isVariadic: true
        generators:
          script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
          descriptionSeparator: "	"
    options:
      - name: ["-o", "--onto"]
        description: "The revision(s) to duplicate onto (can be repeated to create a merge commit)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-A", "--insert-after"]
        description: "The revision(s) to insert after (can be repeated to create a merge commit)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-B", "--insert-before"]
        description: "The revision(s) to insert before (can be repeated to create a merge commit)"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
  - name: "edit"
    description: "Sets the specified revision as the working-copy revision"
    args:
      - name: "revset"
        description: "The commit to edit"
        isOptional: true
        generators:
          script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
          descriptionSeparator: "	"
  - name: ["evolog", "evolution-log"]
    description: "Show how a change has evolved over time"
    options:
      - name: ["-r", "--revisions"]
        description: "Follow changes from these revisions"
        args:
          name: "revsets"
          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-n", "--limit"]
        description: "Limit number of revisions to show"
        args:
          name: "limit"
      - name: "--reversed"
        description: "Show revisions in the opposite order (older revisions first)"
      - name: ["-G", "--no-graph"]
        description: "Show a flat list of revisions instead of a graph"
      - name: ["-T", "--template"]
        description: "Render each revision using the given template"
        args:
          name: "template"
      - name: ["-p", "--patch"]
        description: "Show patch compared to the previous version of this change"
      - name: ["-s", "--summary"]
        description: "For each path, show only whether it was modified, added, or deleted"
      - name: "--stat"
        description: "Show a histogram of the changes"
      - name: "--types"
        description: "For each path, show only its type before and after"
      - name: "--name-only"
        description: "For each path, show only its path"
      - name: "--git"
        description: "Show a Git-format diff"
      - name: "--color-words"
        description: "Show a word-level diff with changes indicated only by color"
      - name: "--tool"
        description: "Generate diff by external command"
        args:
          name: "tool"
      - name: "--context"
        description: "Number of lines of context to show"
        args:
          name: "context"
      - name: "--ignore-all-space"
        description: "Ignore whitespace when comparing lines"
      - name: "--ignore-space-change"
        description: "Ignore changes in amount of whitespace when comparing lines"
  - name: "file"
    description: "File operations"
