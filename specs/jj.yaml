          generators:
            script: "jj log --no-graph --quiet -r 'ancestors(@, 20) | bookmarks()' -T 'change_id.shortest(8) ++ \"\\t\" ++ coalesce(description.first_line(), \"(no description)\") ++ \"\\n\"' 2>/dev/null"
            descriptionSeparator: "	"
      - name: ["-B", "--insert-before"]
        description: "Insert the new change before the given commit(s)"
        args:
