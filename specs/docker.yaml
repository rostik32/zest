# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: docker
description: A self-sufficient runtime for containers
subcommands:
  - name: agent
    description: Docker AI Agent Runner
    subcommands:
    - name: getting-started
    - name: run
      description: Run an agent
    - name: setup
      description: Interactively set up a model (API key or local)
    - name: share
      description: Share agents
    - name: doctor
      description: Diagnose model and credential setup
    - name: models
      description: List available models
    - name: alias
      description: Manage aliases
    - name: board
      description: Orchestrate agents on a Kanban board
    - name: eval
      description: Run evaluations for an agent
    - name: new
      description: Create a new agent configuration
    - name: sandbox
      description: Manage docker-agent sandbox settings
    - name: serve
      description: Start an agent as a server
    - name: version
      description: Print the version information
    options:
    - name: --cache-dir
      description: 'Override the cache directory (default: ~/Library/Caches/cagent on macOS)'
    - name: --config-dir
      description: 'Override the config directory (default: ~/.config/cagent)'
    - name: --data-dir
      description: 'Override the data directory (default: ~/.cagent)'
    - name:
      - -d
      - --debug
      description: Enable debug logging
    - name: --log-file
      description: 'Path to debug log file (default: ~/.cagent/cagent.debug.log; only used with --debug)'
    - name:
      - -o
      - --otel
      description: Enable OpenTelemetry tracing
  - name: ai
    description: Docker AI Agent - Ask Gordon
    subcommands:
    - name: version
      description: Show the version information
    options:
    - name:
      - -C
      - --working-dir
      description: Sets the working directory for the command
  - name: bake
    description: Build from a file
    options:
    - name: --allow
      description: Allow build to access specified resources
    - name: --builder
      description: Override the configured builder instance (default "desktop-linux")
    - name: --call
      description: Set method for evaluating build ("check", "outline", "targets") (default "build")
    - name: --check
      description: Shorthand for "--call=check"
    - name:
      - -D
      - --debug
      description: Enable debug logging
    - name:
      - -f
      - --file
      description: Build definition file
    - name: --list
      description: List targets or variables
    - name: --load
      description: Shorthand for "--set=*.output=type=docker". Conditional.
    - name: --metadata-file
      description: Write build result metadata to a file
    - name: --no-cache
      description: Do not use cache when building the image
    - name: --policy
      description: 'Global policy evaluation options (format: "[disabled=true|false][,strict=true|false][,log-level=level]")'
    - name: --print
      description: Print the options without building
    - name: --progress
      description: Set type of progress output ("auto", "none",  "plain", "quiet", "rawjson", "tty"). Use plain to show container output (default "auto")
    - name: --provenance
      description: Shorthand for "--set=*.attest=type=provenance"
    - name: --pull
      description: Always attempt to pull all referenced images
    - name: --push
      description: Shorthand for "--set=*.output=type=registry". Conditional.
    - name: --sbom
      description: Shorthand for "--set=*.attest=type=sbom"
    - name: --set
      description: Override target value (e.g., "targetpattern.key=value")
    - name: --var
      description: Set a variable value (e.g., "name=value")
  - name: checkpoint
    description: Manage checkpoints
    subcommands:
    - name: create
      description: Create a checkpoint from a running container
    - name: ls
      description: List checkpoints for a container
    - name: rm
      description: Remove a checkpoint
  - name: debug
    description: Get a shell into any image or container
    subcommands:
    - name: docker-cli-plugin-hooks
    options:
    - name:
      - -c
      - --command
      description: Evaluate the specified commands instead, passing additional positional arguments through $argv.
    - name: --host
      description: 'Daemon docker socket to connect to. E.g.: ''ssh://root@example.org'', ''unix:///some/path/docker.sock'''
    - name: --preserve-user
      description: 'Running containers only: Use same user as the running container. Default is root.'
    - name: --privileged
      description: 'Running containers only: Give privileges to the shell (all capabilities).'
    - name: --shell
      description: 'Select a shell. Supported: "bash", "fish", "zsh", "auto". (default auto)'
    - name: --version
      description: Display version of the docker-debug plugin
  - name: desktop
    description: Docker Desktop commands
    subcommands:
    - name: disable
      description: Disable a feature
    - name: enable
      description: Enable a feature
    - name: kubernetes
      description: Manage Kubernetes
    - name: diagnose
      description: Diagnose Docker Desktop
    - name: logs
      description: Print log entries
    - name: restart
      description: Restart Docker Desktop
    - name: start
      description: Start Docker Desktop
    - name: status
      description: Show the status of the Docker Desktop engines
    - name: stop
      description: Stop Docker Desktop
    - name: update
      description: Manage Docker Desktop updates
    - name: version
      description: Show the Docker Desktop CLI plugin version information
  - name: dhi
    description: CLI for managing Docker Hardened Images
    subcommands:
    - name: attestation
      description: View attestations for Docker Hardened Images
    - name: auth
      description: Authenticate with Docker Hub
    - name: catalog
      description: Browse the Docker Hardened Images catalog
    - name: customization
    - name: mirror
      description: Mirror Docker Hardened Images to your organization
    options:
    - name:
      - -v
      - --version
      description: version for dhi
  - name: extension
    description: Manages Docker extensions
    subcommands:
    - name: dev
      description: Extension development helpers
    - name: init
      description: Create a new Docker Extension based on a template.
    - name: install
      description: Install a Docker extension with the specified image
    - name: ls
      description: List installed Docker extensions
    - name: rm
      description: Remove a Docker extension
    - name: share
      description: Generate a link to share the extension.
    - name: update
      description: Remove and re-install a Docker extension
    - name: validate
      description: Validate an extension image or metadata file
    - name: version
      description: Print the client and server versions
    options:
    - name: --socket
      description: The Desktop extension manager socket
  - name: init
    description: Creates Docker-related starter files for your project
    options:
    - name: --version
      description: Display version of the init plugin
  - name: manifest
    description: Manage Docker image manifests and manifest lists
    subcommands:
    - name: annotate
      description: Add additional information to a local image manifest
    - name: create
      description: Create a local manifest list for annotating and pushing to a registry
    - name: inspect
      description: Display an image manifest, or manifest list
    - name: push
      description: Push a manifest list to a repository
    - name: rm
      description: Delete one or more manifest lists from local storage
  - name: mcp
    description: Docker MCP Plugin
    subcommands:
    - name: catalog
      description: Manage MCP server OCI catalogs
    - name: client
      description: Manage MCP clients
    - name: feature
      description: Manage experimental features
    - name: gateway
      description: Manage the MCP Server gateway
    - name: oauth
      description: Manage OAuth app authorizations
    - name: profile
      description: Manage profiles
    - name: secret
      description: Manage secrets in the local OS Keychain
    - name: server
      description: Manage servers
    - name: template
      description: Manage starter profile templates
    - name: tools
      description: Manage tools
    - name: version
      description: Show the version information
    options:
    - name:
      - -v
      - --version
      description: Print version information and quit
  - name: model
    description: Docker Model Runner
    subcommands:
    - name: context
      description: Manage Docker Model Runner contexts
    - name: bench
      description: Benchmark a model's performance at different concurrency levels
    - name: df
      description: Show Docker Model Runner disk usage
    - name: gateway
      description: Run an OpenAI-compatible LLM gateway
    - name: inspect
      description: Display detailed information on one model
    - name: install-runner
      description: Install Docker Model Runner (Docker Engine only)
    - name: launch
      description: Launch an app configured to use Docker Model Runner
    - name: list
      description: List the models pulled to your local environment
    - name: logs
      description: Fetch the Docker Model Runner logs
    - name: package
      description: Package a model into a Docker Model OCI artifact
    - name: ps
      description: List running models
    - name: pull
      description: Pull a model from Docker Hub or HuggingFace to your local environment
    - name: purge
      description: Remove all models
    - name: push
      description: Push a model to Docker Hub or Hugging Face
    - name: reinstall-runner
    - name: requests
      description: Fetch requests+responses from Docker Model Runner
    - name: restart-runner
      description: Restart Docker Model Runner (Docker Engine only)
    - name: rm
      description: Remove local models downloaded from Docker Hub
    - name: run
      description: Run a model and interact with it using a submitted prompt or chat mode
    - name: search
      description: Search for models on Docker Hub and HuggingFace
    - name: show
      description: Show information for a model
    - name: skills
      description: Install Docker Model Runner skills for AI coding assistants
    - name: start-runner
      description: Start Docker Model Runner (Docker Engine only)
    - name: status
      description: Check if the Docker Model Runner is running
    - name: stop-runner
      description: Stop Docker Model Runner (Docker Engine only)
    - name: tag
      description: Tag a model
    - name: uninstall-runner
    - name: unload
      description: Unload running models
    - name: version
      description: Show the Docker Model Runner version
  - name: offload
    description: Docker Offload
    subcommands:
    - name: start
      description: Start a Docker Offload session
    - name: status
      description: Show the status of the Docker Offload connection
    - name: stop
      description: Stop a Docker Offload session
    - name: version
      description: Prints the version
  - name: pass
    description: Docker Pass Secrets Manager Plugin (beta)
    subcommands:
    - name: get
      description: Get a secret from a keystore.
    - name: ls
      description: List all secrets from local keychain.
    - name: plugins
      description: Manage secrets engine plugins.
    - name: rm
      description: Remove secrets from local keychain.
    - name: run
      description: Run a command with `se://` environment references resolved.
    - name: set
      description: Set a secret
  - name: scout
    description: Docker Scout
    subcommands:
    - name: attestation
      description: Manage attestations on images
    - name: cache
      description: Manage Docker Scout cache and temporary files
    - name: compare
      description: Compare two images and display differences (experimental)
    - name: config
      description: Manage Docker Scout configuration
    - name: cves
      description: Display CVEs identified in a software artifact
    - name: enroll
      description: Enroll an organization with Docker Scout
    - name: environment
      description: Manage environments (experimental)
    - name: help
      description: Display information about the available commands
    - name: integration
      description: Commands to list, configure, and delete Docker Scout integrations
    - name: policy
      description: Evaluate local Rego policies against an image and display the results (experimental)
    - name: push
      description: Push an image or image index to Docker Scout
    - name: quickview
      description: Quick overview of an image
    - name: recommendations
      description: Display available base image updates and remediation recommendations
    - name: repo
      description: Commands to list, enable, and disable Docker Scout on repositories
    - name: version
      description: Show Docker Scout version information
    - name: vex
      description: Manage VEX attestations on images
    - name: watch
      description: Watch repositories in a registry and push images and indexes to Docker Scout
  - name: attach
    description: Attach local standard input, output, and error streams to a running container,
    options:
      - name: --detach-keys
        description: Override the key sequence for detaching a container
        args:
          name: string
      - name: --no-stdin
        description: Do not attach STDIN
      - name: --sig-proxy
        description: Proxy all received signals to the process (default true)
  - name: build
    description: Build an image from a Dockerfile
    options:
      - name: --add-host
        args:
          name: list
          description: Add a custom host-to-IP mapping (host:ip)
      - name: --build-arg
        args:
          name: list
          description: Set build-time variables
      - name: --cache-from
        args:
          name: strings
          description: Images to consider as cache sources
      - name: --disable-content-trust
        description: Skip image verification (default true)
      - name:
          - -f
          - --file
        description: Name of the Dockerfile (Default is 'PATH/Dockerfile')
        args:
          name: string
          generators:
            template: filepaths
      - name: --iidfile
        description: Write the image ID to the file
        args:
          name: string
      - name: --isolation
        description: Container isolation technology
        args:
          name: string
      - name: --label
        description: Set metadata for an image
        args:
          name: list
      - name: --network
        description: Set the networking mode for the RUN instructions during build (default "default")
        args:
          name: string
      - name: --no-cache
        description: Do not use cache when building the image
      - name:
          - -o
          - --output
        description: "Output destination (format: type=local,dest=path)"
        args:
          name: stringArray
      - name: --platform
        description: Set platform if server is multi-platform capable
        args:
          name: string
      - name: --progress
        description: Set type of progress output (auto, plain, tty). Use plain to show container output
        args:
          name: string
          suggestions:
            - auto
            - plain
            - tty
      - name: --pull
        description: Always attempt to pull a newer version of the image
      - name:
          - -q
          - --quiet
        description: Suppress the build output and print image ID on success
      - name: --secret
        description: "Secret file to expose to the build (only if BuildKit enabled): id=mysecret,src=/local/secret"
        args:
          name: stringArray
      - name: --squash
        description: Squash newly built layers into a single new layer
      - name: --ssh
        description: "SSH agent socket or keys to expose to the build (only if BuildKit enabled) (format: default|<id>[=<socket>|<key>[,<key>]])"
        args:
          name: stringArray
      - name:
          - -t
          - --tag
        description: Name and optionally a tag in the 'name:tag' format
      - name: --target
        description: Set the target build stage to build
        args:
          name: target build stage
          generators:
            js:
              script: 1
              postProcess: 2
              trigger: 0
    args:
      name: path
      generators:
        template: folders
  - name: commit
    description: Create a new image from a container's changes
    options:
      - name:
          - -a
          - --author
        description: Author (e.g., "John Hannibal Smith <hannibal@a-team.com>")
        args:
          name: string
      - name:
          - -c
          - --change
        description: Apply Dockerfile instruction to the created image
        args:
          name: list
      - name:
          - -m
          - --message
        description: Commit message
        args:
          name: string
      - name:
          - -p
          - --pause
        description: Pause container during commit (default true)
    args:
      - name: container
        generators:
          script:
            - docker
            - ps
            - --format
            - "{{ json . }}"
          js:
            postProcess: 3
      - name: "[REPOSITORY[:TAG]]"
  - name: cp
    description: Copy files/folders between a container and the local filesystem
    options:
      - name:
          - -a
          - --archive
        description: Archive mode (copy all uid/gid information)
      - name:
          - -L
          - --follow-link
        description: Always follow symbol link in SRC_PATH
    args:
      name: CONTAINER:SRC_PATH DEST_PATH|- OR SRC_PATH|- CONTAINER:DEST_PATH
  - name: create
    description: Create a new container
    options:
      - name: --add-host
        description: Add a custom host-to-IP mapping (host:ip)
        args:
          name: list
      - name:
          - -a
          - --attach
        description: Attach to STDIN, STDOUT or STDERR
        args:
          name: list
      - name: --blkio-weight
        description: Block IO (relative weight), between 10 and 1000, or 0 to disable (default 0)
        args:
          name: uint16
      - name: --blkio-weight-device
        description: Block IO weight (relative device weight) (default [])
        args:
          name: list
      - name: --cap-add
        description: Add Linux capabilities
        args:
          name: list
      - name: --cap-drop
        description: Drop Linux capabilities
        args:
          name: list
      - name: --cgroup-parent
        description: Optional parent cgroup for the container
        args:
          name: string
      - name: --cgroupns
        description: Cgroup namespace to use (host|private)
        args:
          name: string
      - name: --cidfile
        description: Write the container ID to the file
        args:
          name: string
      - name: --cpu-period
        description: Limit CPU CFS (Completely Fair Scheduler) period
        args:
          name: int
      - name: --cpu-quota
        description: Limit CPU CFS (Completely Fair Scheduler) quota
        args:
          name: int
      - name: --cpu-rt-period
        description: Limit CPU real-time period in microseconds
        args:
          name: int
      - name: --cpu-rt-runtime
        description: Limit CPU real-time runtime in microseconds
        args:
          name: int
      - name:
          - -c
          - --cpu-shares
        description: CPU shares (relative weight)
        args:
          name: int
      - name: --cpus
        description: Number of CPUs
        args:
          name: decimal
      - name: --cpuset-cpus
        description: CPUs in which to allow execution (0-3, 0,1)
        args:
          name: string
      - name: --cpuset-mems
        description: MEMs in which to allow execution (0-3, 0,1)
        args:
          name: string
      - name: --device
        description: Add a host device to the container
        args:
          name: list
      - name: --device-cgroup-rule
        description: Add a rule to the cgroup allowed devices list
        args:
          name: list
      - name: --device-read-bps
        description: Limit read rate (bytes per second) from a device (default [])
        args:
          name: list
      - name: --device-read-iops
        description: Limit read rate (IO per second) from a device (default [])
        args:
          name: list
      - name: --device-write-bps
        description: Limit write rate (bytes per second) to a device (default [])
        args:
          name: list
      - name: --device-write-iops
        description: Limit write rate (IO per second) to a device (default [])
        args:
          name: list
      - name: --disable-content-trust
        description: Skip image verification (default true)
      - name: --dns
        description: Set custom DNS servers
        args:
          name: list
      - name: --dns-option
        description: Set DNS options
        args:
          name: list
      - name: --dns-search
        description: Set custom DNS search domains
        args:
          name: list
      - name: --domainname
        description: Container NIS domain name
        args:
          name: string
      - name: --entrypoint
        description: Overwrite the default ENTRYPOINT of the image
        args:
          name: string
      - name:
          - -e
          - --env
        description: Set environment variables
        args:
          name: list
      - name: --env-file
        description: Read in a file of environment variables
        args:
          name: list
      - name: --expose
        description: Expose a port or a range of ports
        args:
          name: list
      - name: --gpus
        description: GPU devices to add to the container ('all' to pass all GPUs)
        args:
          name: gpu-request
      - name: --group-add
        description: Add additional groups to join
        args:
          name: list
      - name: --health-cmd
        description: Command to run to check health
        args:
          name: string
      - name: --health-interval
        description: Time between running the check (ms|s|m|h) (default 0s)
        args:
          name: duration
      - name: --health-retries
        description: Consecutive failures needed to report unhealthy
        args:
          name: int
      - name: --health-start-period
        description: Start period for the container to initialize before starting health-retries countdown (ms|s|m|h) (default 0s)
        args:
          name: duration
      - name: --health-timeout
        description: Maximum time to allow one check to run (ms|s|m|h) (default 0s)
        args:
          name: duration
      - name: --help
        description: Print usage
      - name:
          - -h
          - --hostname
        description: Container host name
        args:
          name: string
      - name: --init
        description: Run an init inside the container that forwards signals and reaps processes
      - name:
          - -i
          - --interactive
        description: Keep STDIN open even if not attached
      - name: --ip
        description: IPv4 address (e.g., 172.30.100.104)
        args:
          name: string
      - name: --ip6
        description: IPv6 address (e.g., 2001:db8::33)
        args:
          name: string
      - name: --ipc
        description: IPC mode to use
        args:
          name: string
      - name: --isolation
        description: Container isolation technology
        args:
          name: string
      - name: --kernel-memory
        description: Kernel memory limit
        args:
          name: bytes
      - name:
          - -l
          - --label
        description: Set meta data on a container
        args:
          name: list
      - name: --label-file
        description: Read in a line delimited file of labels
        args:
          name: list
      - name: --link
        description: Add link to another container
        args:
          name: list
      - name: --link-local-ip
        description: Container IPv4/IPv6 link-local addresses
        args:
          name: list
      - name: --log-driver
        description: Logging driver for the container
        args:
          name: string
      - name: --log-opt
        description: Log driver options
        args:
          name: list
      - name: --mac-address
        description: Container MAC address (e.g., 92:d0:c6:0a:29:33)
        args:
          name: string
      - name:
          - -m
          - --memory
        description: Memory limit
        args:
          name: bytes
      - name: --memory-reservation
        description: Memory soft limit
        args:
          name: bytes
      - name: --memory-swap
        description: "Swap limit equal to memory plus swap: '-1' to enable unlimited swap"
        args:
          name: bytes
      - name: --memory-swappiness
        description: Tune container memory swappiness (0 to 100) (default -1)
        args:
          name: int
      - name: --mount
        description: Attach a filesystem mount to the container
        args:
          name: mount
      - name: --name
        description: Assign a name to the container
        args:
          name: string
      - name: --network
        description: Connect a container to a network
        args:
          name: network
      - name: --network-alias
        description: Add network-scoped alias for the container
        args:
          name: list
      - name: --no-healthcheck
        description: Disable any container-specified HEALTHCHECK
      - name: --oom-kill-disable
        description: Disable OOM Killer
      - name: --oom-score-adj
        description: Tune host's OOM preferences (-1000 to 1000)
        args:
          name: int
      - name: --pid
        description: PID namespace to use
        args:
          name: string
      - name: --pids-limit
        description: Tune container pids limit (set -1 for unlimited)
        args:
          name: int
      - name: --platform
        description: Set platform if server is multi-platform capable
        args:
          name: string
      - name: --privileged
        description: Give extended privileges to this container
      - name:
          - -p
          - --publish
        description: Publish a container's port(s) to the host
        args:
          name: list
      - name:
          - -P
          - --publish-all
        description: Publish all exposed ports to random ports
      - name: --pull
        description: Pull image before creating ("always"|"missing"|"never") (default "missing")
        args:
          name: string
      - name: --read-only
        description: Mount the container's root filesystem as read only
      - name: --restart
        description: Restart policy to apply when a container exits (default "no")
        args:
          name: string
      - name: --rm
        description: Automatically remove the container when it exits
      - name: --runtime
        description: Runtime to use for this container
        args:
          name: string
      - name: --security-opt
        description: Security Options
        args:
          name: list
      - name: --shm-size
        description: Size of /dev/shm
        args:
          name: bytes
      - name: --stop-signal
        description: Signal to stop a container (default "SIGTERM")
        args:
          name: string
      - name: --stop-timeout
        description: Timeout (in seconds) to stop a container
        args:
          name: int
      - name: --storage-opt
        description: Storage driver options for the container
        args:
          name: list
      - name: --sysctl
        description: Sysctl options (default map[])
        args:
          name: map
      - name: --tmpfs
        description: Mount a tmpfs directory
        args:
          name: list
      - name:
          - -t
          - --tty
        description: Allocate a pseudo-TTY
      - name: --ulimit
        description: Ulimit options (default [])
        args:
          name: ulimit
      - name:
          - -u
          - --user
        description: "Username or UID (format: <name|uid>[:<group|gid>])"
        args:
          name: string
      - name: --userns
        description: User namespace to use
        args:
          name: string
      - name: --uts
        description: UTS namespace to use
        args:
          name: string
      - name:
          - -v
          - --volume
        description: Bind mount a volume
