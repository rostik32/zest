              - ls
              - --format
              - "{{ json . }}"
            js:
              postProcess: 4
      - name: tag
        description: Create a tag TARGET_IMAGE that refers to SOURCE_IMAGE
        args:
          name: SOURCE_IMAGE[:TAG] TARGET_IMAGE[:TAG]
