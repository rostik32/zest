# Biome. Generated from the CLI reference (src/content/docs/en/reference/cli.mdx) in github.com/biomejs/website.
name: biome
description: Format, lint and more for JavaScript, TypeScript, JSON, CSS and GraphQL
options:
  - name: ["-h", "--help"]
    description: "Prints help information"
    isPersistent: true
  - name: ["-V", "--version"]
    description: "Prints version information"
    isPersistent: true
  - name: "--colors"
    description: "Controls ANSI styling: off disables it, while force enables it even when the output does not appear to support ANSI escapes"
    isPersistent: true
    args:
      name: value
      suggestions: ["off", "force"]
    requiresSeparator: true
  - name: "--use-server"
    description: "Connects to a running instance of the Biome daemon server"
    isPersistent: true
  - name: "--verbose"
    description: "Shows additional diagnostic details and lists the files that were processed or modified"
    isPersistent: true
  - name: "--config-path"
    description: "Sets the path to the configuration file or the directory where Biome should search for biome.json or biome.jsonc"
    isPersistent: true
    args:
      name: "path"
      template: filepaths
    requiresSeparator: true
  - name: "--max-diagnostics"
    description: "Limits the number of diagnostics displayed"
    isPersistent: true
    args:
      name: value
      suggestions: ["none", "NUMBER"]
    requiresSeparator: true
  - name: "--skip-parse-errors"
    description: "Skips files containing syntax errors instead of emitting an error diagnostic"
    isPersistent: true
  - name: "--no-errors-on-unmatched"
    description: "Does not emit an error when no files are processed"
    isPersistent: true
  - name: "--error-on-warnings"
    description: "Exits with an error status if any warning diagnostics are emitted"
    isPersistent: true
