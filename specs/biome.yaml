  - name: "--reporter"
    description: "Changes how diagnostics and the run summary are written"
    isPersistent: true
    args:
      name: "format"
    requiresSeparator: true
  - name: "--reporter-file"
    description: "Writes the associated reporter's output to PATH"
    isPersistent: true
    args:
      name: "path"
      template: filepaths
    requiresSeparator: true
  - name: "--watcher-kind"
    description: "Selects how the daemon server detects file changes"
