# yaml-language-server: $schema=https://raw.githubusercontent.com/rostik32/zest/main/schema/spec.schema.json
# uvx, an alias for `uv tool run`. Generated from uv's CLI reference (docs.astral.sh/uv/reference/cli).
name: uvx
description: Run a command provided by a Python package
args:
  name: command
  description: The package's command, e.g. ruff
  isCommand: true
options:
  - name: ["--allow-insecure-host", "--trusted-host"]
    description: "Allow insecure connections to a host"
    args:
      name: "allow-insecure-host"
  - name: ["--build-constraints", "--build-constraint", "-b"]
    description: "Constrain build dependencies using the given requirements files when building source distributions"
    args:
      name: "build-constraints"
      template: filepaths
  - name: "--cache-dir"
    description: "Path to the cache directory"
    args:
      name: "cache-dir"
      template: filepaths
  - name: "--color"
    description: "Control the use of color in output"
    args:
      name: "color-choice"
      suggestions:
        - name: "auto"
          description: "Enables colored output only when the output is going to a terminal or TTY with support"
        - name: "always"
          description: "Enables colored output regardless of the detected environment"
        - name: "never"
          description: "Disables colored output"
  - name: ["--compile-bytecode", "--compile"]
    description: "Compile Python files to bytecode after installation"
  - name: "--config-file"
    description: "The path to a uv.toml file to use for configuration"
    args:
      name: "config-file"
      template: filepaths
  - name: ["--config-setting", "--config-settings", "-C"]
    description: "Settings to pass to the PEP 517 build backend, specified as KEY=VALUE pairs"
    args:
      name: "config-setting"
  - name: ["--config-settings-package", "--config-settings-package"]
    description: "Settings to pass to the PEP 517 build backend for a specific package, specified as PACKAGE:KEY=VALUE pairs"
    args:
      name: "config-settings-package"
  - name: ["--constraints", "--constraint", "-c"]
    description: "Constrain versions using the given requirements files"
    args:
      name: "constraints"
      template: filepaths
  - name: "--default-index"
    description: "The default package index (by default: https://pypi.org/simple)"
    args:
      name: "default-index"
  - name: "--directory"
    description: "Change to the given directory prior to running the command"
    args:
      name: "directory"
      template: filepaths
  - name: "--env-file"
    description: "Load environment variables from a .env file"
    args:
      name: "env-file"
      template: filepaths
  - name: "--exclude-newer"
    description: "Limit candidate packages to those that were uploaded prior to the given date"
    args:
      name: "exclude-newer"
  - name: "--exclude-newer-package"
    description: "Limit candidate packages for specific packages to those that were uploaded prior to the given date"
    args:
      name: "exclude-newer-package"
  - name: "--extra-index-url"
    description: "(Deprecated: use --index instead) Extra URLs of package indexes to use, in addition to --index-url"
    args:
      name: "extra-index-url"
  - name: ["--find-links", "-f"]
    description: "Locations to search for candidate distributions, in addition to those found in the registry indexes"
    args:
      name: "find-links"
  - name: "--fork-strategy"
    description: "The strategy to use when selecting multiple versions of a given package across Python versions and platforms"
    args:
      name: "fork-strategy"
      suggestions:
        - name: "fewest"
          description: "Optimize for selecting the fewest number of versions for each package. Older versions may be preferred if they are compatible with a wider range of supported Python versions or platforms"
        - name: "requires-python"
          description: "Optimize for selecting latest supported version of each package, for each supported Python version"
  - name: "--from"
    description: "Use the given package to provide the command"
    args:
      name: "from"
  - name: ["--help", "-h"]
    description: "Display the concise help for this command"
  - name: "--index"
    description: "The indexes to use when resolving dependencies, in addition to the default index"
    args:
      name: "index"
  - name: "--index-strategy"
    description: "The strategy to use when resolving against multiple index URLs"
    args:
      name: "index-strategy"
      suggestions:
        - name: "first-index"
          description: "Only use results from the first index that returns a match for a given package name"
        - name: "unsafe-first-match"
          description: "Search for every package name across all indexes, exhausting the versions from the first index before moving on to the next"
        - name: "unsafe-best-match"
          description: "Search for every package name across all indexes, preferring the \"best\" version found. If a package version is in multiple indexes, only look at the entry for the first index"
  - name: ["--index-url", "-i"]
    description: "(Deprecated: use --default-index instead) The URL of the Python package index (by default: https://pypi.org/simple)"
    args:
      name: "index-url"
  - name: "--isolated"
    description: "Run the tool in an isolated virtual environment, ignoring any already-installed tools"
  - name: "--keyring-provider"
    description: "Attempt to use keyring for authentication for index URLs"
    args:
      name: "keyring-provider"
      suggestions:
        - name: "disabled"
          description: "Do not use keyring for credential lookup"
        - name: "subprocess"
          description: "Use the keyring command for credential lookup"
  - name: "--lfs"
    description: "Whether to use Git LFS when adding a dependency from Git"
  - name: "--link-mode"
    description: "The method to use when installing packages from the global cache"
    args:
      name: "link-mode"
      suggestions:
        - name: "clone"
          description: "Clone (i.e., copy-on-write) packages from the source into the destination"
        - name: "copy"
          description: "Copy packages from the source into the destination"
        - name: "hardlink"
          description: "Hard link packages from the source into the destination"
        - name: "symlink"
          description: "Symbolically link packages from the source into the destination"
  - name: "--managed-python"
    description: "Require use of uv-managed Python versions"
  - name: "--no-binary"
    description: "Don't install pre-built wheels"
  - name: "--no-binary-package"
    description: "Don't install pre-built wheels for a specific package"
    args:
      name: "no-binary-package"
  - name: "--no-build"
    description: "Don't build source distributions"
  - name: "--no-build-isolation"
    description: "Disable isolation when building source distributions"
  - name: "--no-build-isolation-package"
    description: "Disable isolation when building source distributions for a specific package"
    args:
      name: "no-build-isolation-package"
  - name: "--no-build-package"
    description: "Don't build source distributions for a specific package"
    args:
      name: "no-build-package"
  - name: ["--no-cache", "--no-cache-dir", "-n"]
    description: "Avoid reading from or writing to the cache, instead using a temporary directory for the duration of the operation"
  - name: "--no-config"
    description: "Avoid discovering configuration files (pyproject.toml, uv.toml)"
  - name: "--no-env-file"
    description: "Avoid reading environment variables from a .env file"
  - name: "--no-index"
    description: "Ignore the registry index (e.g., PyPI), instead relying on direct URL dependencies and those provided via --find-links"
  - name: "--no-managed-python"
    description: "Disable use of uv-managed Python versions"
  - name: "--no-progress"
    description: "Hide all progress outputs"
  - name: "--no-python-downloads"
    description: "Disable automatic downloads of Python"
  - name: "--no-require-build-hashes"
    description: "Do not require hashes for every build dependency"
  - name: "--no-sources"
    description: "Ignore the tool.uv.sources table when resolving dependencies"
  - name: "--no-sources-package"
    description: "Don't use sources from the tool.uv.sources table for the specified packages"
    args:
      name: "no-sources-package"
  - name: "--offline"
    description: "Disable network access"
  - name: ["--overrides", "--override"]
    description: "Override versions using the given requirements files"
    args:
      name: "overrides"
      template: filepaths
  - name: "--prerelease"
    description: "The strategy to use when considering pre-release versions"
    args:
      name: "prerelease"
      suggestions:
        - name: "disallow"
          description: "Disallow all pre-release versions"
        - name: "allow"
          description: "Allow all pre-release versions"
        - name: "if-necessary"
          description: "Prefer stable versions, falling back to pre-release versions when necessary"
        - name: "explicit"
          description: "Prefer stable versions for first-party packages with explicit pre-release specifiers, falling back to pre-release versions when necessary. Disallow pre-release versions for all other packages"
        - name: "if-necessary-or-explicit"
          description: "Deprecated alias for if-necessary"
  - name: "--prerelease-package"
    description: "The strategy to use when considering pre-release versions for a specific package"
    args:
      name: "prerelease-package"
  - name: "--project"
    description: "Discover a project in the given directory"
    args:
      name: "project"
  - name: ["--python", "-p"]
    description: "The Python interpreter to use to build the run environment"
    args:
      name: "python"
  - name: "--python-platform"
    description: "The platform for which requirements should be installed"
    args:
      name: "python-platform"
      suggestions:
        - name: "windows"
          description: "An alias for x86_64-pc-windows-msvc, the default target for Windows"
        - name: "linux"
          description: "An alias for x86_64-unknown-linux-gnu, the default target for Linux"
        - name: "macos"
          description: "An alias for aarch64-apple-darwin, the default target for macOS"
        - name: "x86_64-pc-windows-msvc"
          description: "A 64-bit x86 Windows target"
        - name: "aarch64-pc-windows-msvc"
          description: "An ARM64 Windows target"
        - name: "i686-pc-windows-msvc"
          description: "A 32-bit x86 Windows target"
        - name: "x86_64-unknown-linux-gnu"
          description: "An x86 Linux target. Equivalent to x86_64-manylinux_2_28"
        - name: "aarch64-apple-darwin"
          description: "An ARM-based macOS target, as seen on Apple Silicon devices"
        - name: "x86_64-apple-darwin"
          description: "An x86 macOS target"
        - name: "aarch64-unknown-linux-gnu"
          description: "An ARM64 Linux target. Equivalent to aarch64-manylinux_2_28"
        - name: "aarch64-unknown-linux-musl"
          description: "An ARM64 Linux target"
        - name: "x86_64-unknown-linux-musl"
          description: "An x86_64 Linux target"
        - name: "riscv64-unknown-linux"
          description: "A RISCV64 Linux target"
        - name: "x86_64-manylinux2014"
          description: "An x86_64 target for the manylinux2014 platform. Equivalent to x86_64-manylinux_2_17"
        - name: "x86_64-manylinux_2_17"
          description: "An x86_64 target for the manylinux_2_17 platform"
        - name: "x86_64-manylinux_2_28"
          description: "An x86_64 target for the manylinux_2_28 platform"
        - name: "x86_64-manylinux_2_31"
          description: "An x86_64 target for the manylinux_2_31 platform"
        - name: "x86_64-manylinux_2_32"
          description: "An x86_64 target for the manylinux_2_32 platform"
        - name: "x86_64-manylinux_2_33"
          description: "An x86_64 target for the manylinux_2_33 platform"
        - name: "x86_64-manylinux_2_34"
          description: "An x86_64 target for the manylinux_2_34 platform"
        - name: "x86_64-manylinux_2_35"
          description: "An x86_64 target for the manylinux_2_35 platform"
        - name: "x86_64-manylinux_2_36"
          description: "An x86_64 target for the manylinux_2_36 platform"
        - name: "x86_64-manylinux_2_37"
          description: "An x86_64 target for the manylinux_2_37 platform"
        - name: "x86_64-manylinux_2_38"
          description: "An x86_64 target for the manylinux_2_38 platform"
        - name: "x86_64-manylinux_2_39"
          description: "An x86_64 target for the manylinux_2_39 platform"
        - name: "x86_64-manylinux_2_40"
          description: "An x86_64 target for the manylinux_2_40 platform"
        - name: "aarch64-manylinux2014"
          description: "An ARM64 target for the manylinux2014 platform. Equivalent to aarch64-manylinux_2_17"
        - name: "aarch64-manylinux_2_17"
          description: "An ARM64 target for the manylinux_2_17 platform"
        - name: "aarch64-manylinux_2_28"
          description: "An ARM64 target for the manylinux_2_28 platform"
        - name: "aarch64-manylinux_2_31"
          description: "An ARM64 target for the manylinux_2_31 platform"
        - name: "aarch64-manylinux_2_32"
          description: "An ARM64 target for the manylinux_2_32 platform"
        - name: "aarch64-manylinux_2_33"
          description: "An ARM64 target for the manylinux_2_33 platform"
        - name: "aarch64-manylinux_2_34"
          description: "An ARM64 target for the manylinux_2_34 platform"
        - name: "aarch64-manylinux_2_35"
          description: "An ARM64 target for the manylinux_2_35 platform"
        - name: "aarch64-manylinux_2_36"
          description: "An ARM64 target for the manylinux_2_36 platform"
        - name: "aarch64-manylinux_2_37"
          description: "An ARM64 target for the manylinux_2_37 platform"
        - name: "aarch64-manylinux_2_38"
          description: "An ARM64 target for the manylinux_2_38 platform"
        - name: "aarch64-manylinux_2_39"
          description: "An ARM64 target for the manylinux_2_39 platform"
        - name: "aarch64-manylinux_2_40"
          description: "An ARM64 target for the manylinux_2_40 platform"
        - name: "aarch64-linux-android"
          description: "An ARM64 Android target"
        - name: "x86_64-linux-android"
          description: "An x86_64 Android target"
        - name: "wasm32-pyodide2024"
          description: "A wasm32 target using the Pyodide 2024 platform. Meant for use with Python 3.12. See https://pyodide.org/en/stable/development/abi/312.html"
        - name: "wasm32-pyodide2025"
          description: "A wasm32 target using the Pyodide 2025 platform. Meant for use with Python 3.13. See https://pyodide.org/en/stable/development/abi/313.html"
        - name: "arm64-apple-ios"
          description: "An ARM64 target for iOS device"
        - name: "arm64-apple-ios-simulator"
          description: "An ARM64 target for iOS simulator"
        - name: "x86_64-apple-ios-simulator"
          description: "An x86_64 target for iOS simulator"
  - name: ["--quiet", "-q"]
    description: "Use quiet output"
  - name: "--refresh"
    description: "Refresh all cached data"
  - name: "--refresh-package"
    description: "Refresh cached data for a specific package"
    args:
      name: "refresh-package"
  - name: ["--reinstall", "--force-reinstall"]
    description: "Reinstall all packages, regardless of whether they're already installed"
  - name: "--reinstall-package"
    description: "Reinstall a specific package, regardless of whether it's already installed"
    args:
      name: "reinstall-package"
  - name: "--require-build-hashes"
    description: "Require hashes for all build dependencies"
  - name: "--resolution"
    description: "The strategy to use when selecting between the different compatible versions for a given package requirement"
    args:
      name: "resolution"
      suggestions:
        - name: "highest"
          description: "Resolve the highest compatible version of each package"
        - name: "lowest"
          description: "Resolve the lowest compatible version of each package"
        - name: "lowest-direct"
          description: "Resolve the lowest compatible version of any direct dependencies, and the highest compatible version of any transitive dependencies"
  - name: "--system-certs"
    description: "Whether to load TLS certificates from the platform's native certificate store"
  - name: "--torch-backend"
    description: "The backend to use when fetching packages in the PyTorch ecosystem (e.g., cpu, cu126, or auto)"
    args:
      name: "torch-backend"
      suggestions:
        - name: "auto"
          description: "Select the appropriate PyTorch index based on the operating system and CUDA driver version"
        - name: "cpu"
          description: "Use the CPU-only PyTorch index"
        - name: "cu132"
          description: "Use the PyTorch index for CUDA 13.2"
        - name: "cu130"
          description: "Use the PyTorch index for CUDA 13.0"
        - name: "cu129"
          description: "Use the PyTorch index for CUDA 12.9"
        - name: "cu128"
          description: "Use the PyTorch index for CUDA 12.8"
        - name: "cu126"
          description: "Use the PyTorch index for CUDA 12.6"
        - name: "cu125"
          description: "Use the PyTorch index for CUDA 12.5"
        - name: "cu124"
          description: "Use the PyTorch index for CUDA 12.4"
        - name: "cu123"
          description: "Use the PyTorch index for CUDA 12.3"
        - name: "cu122"
          description: "Use the PyTorch index for CUDA 12.2"
        - name: "cu121"
          description: "Use the PyTorch index for CUDA 12.1"
        - name: "cu120"
          description: "Use the PyTorch index for CUDA 12.0"
        - name: "cu118"
          description: "Use the PyTorch index for CUDA 11.8"
        - name: "cu117"
          description: "Use the PyTorch index for CUDA 11.7"
        - name: "cu116"
          description: "Use the PyTorch index for CUDA 11.6"
        - name: "cu115"
          description: "Use the PyTorch index for CUDA 11.5"
        - name: "cu114"
          description: "Use the PyTorch index for CUDA 11.4"
        - name: "cu113"
          description: "Use the PyTorch index for CUDA 11.3"
        - name: "cu112"
          description: "Use the PyTorch index for CUDA 11.2"
        - name: "cu111"
          description: "Use the PyTorch index for CUDA 11.1"
        - name: "cu110"
          description: "Use the PyTorch index for CUDA 11.0"
        - name: "cu102"
          description: "Use the PyTorch index for CUDA 10.2"
        - name: "cu101"
          description: "Use the PyTorch index for CUDA 10.1"
        - name: "cu100"
          description: "Use the PyTorch index for CUDA 10.0"
        - name: "cu92"
          description: "Use the PyTorch index for CUDA 9.2"
        - name: "cu91"
          description: "Use the PyTorch index for CUDA 9.1"
        - name: "cu90"
          description: "Use the PyTorch index for CUDA 9.0"
        - name: "cu80"
          description: "Use the PyTorch index for CUDA 8.0"
        - name: "rocm7.2"
          description: "Use the PyTorch index for ROCm 7.2"
        - name: "rocm7.1"
          description: "Use the PyTorch index for ROCm 7.1"
        - name: "rocm7.0"
          description: "Use the PyTorch index for ROCm 7.0"
        - name: "rocm6.4"
          description: "Use the PyTorch index for ROCm 6.4"
        - name: "rocm6.3"
          description: "Use the PyTorch index for ROCm 6.3"
        - name: "rocm6.2.4"
