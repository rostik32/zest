        - name: "xpu"
          description: "Use the PyTorch index for Intel XPU"
  - name: ["--upgrade", "-U"]
    description: "Allow package upgrades, ignoring pinned versions in any existing output file"
  - name: "--upgrade-group"
    description: "Allow upgrades for all packages in a dependency group, ignoring pinned versions in any existing output file"
    args:
      name: "upgrade-group"
  - name: ["--upgrade-package", "-P"]
    description: "Allow upgrades for a specific package, ignoring pinned versions in any existing output file"
    args:
      name: "upgrade-package"
  - name: ["--verbose", "-v"]
    description: "Use verbose output"
  - name: ["--with", "-w"]
    description: "Run with the given packages installed"
    args:
      name: "with"
  - name: "--with-editable"
    description: "Run with the given packages installed in editable mode"
    args:
      name: "with-editable"
  - name: "--with-requirements"
    description: "Run with the packages listed in the given files"
    args:
      name: "with-requirements"
      template: filepaths
