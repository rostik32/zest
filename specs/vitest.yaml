  - name: "--experimental.preParse"
    description: "Parse test specifications before running them"
    isPersistent: true
  - name: "--experimental.diagnostics.isolate"
    description: "Print a hint estimating how much time isolate: false would save when isolate: true spends a significant amount of time spawning a worker per test file"
    isPersistent: true
  - name: "--experimental.diagnostics.environment"
    description: "Print a hint when re-creating a DOM environment for every test file dominates the run and a vm pool would set it up once per worker"
    isPersistent: true
  - name: "--experimental.diagnostics.import"
    description: "Print a hint when test files repeatedly evaluate the same module graph (typical for barrel-file imports) and isolate: false would evaluate it once per worker"
    isPersistent: true
  - name: "--experimental.diagnostics.transform"
    description: "Print a hint when transforming modules dominates the run and fsModuleCache would persist the results across runs"
    isPersistent: true
subcommands:
  - name: "run"
    description: "Perform a single run without watch mode"
    args:
      name: filter
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: "watch"
    description: "Run all test suites but watch for changes and rerun tests when they change"
    args:
      name: filter
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: "dev"
    description: "Alias to vitest watch"
    args:
      name: filter
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: "related"
    description: "Run only tests that cover a list of source files"
    args:
      name: filter
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: "bench"
    description: "Run only benchmark tests, which compare performance results"
    args:
      name: filter
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: "init"
    description: "vitest init <name> can be used to setup project configuration"
  - name: "list"
    description: "vitest list command inherits all vitest options to print the list of all matching tests"
    args:
      name: filter
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: "doctor"
    description: "vitest doctor measures how much faster the test suite would run under alternative configurations by running it under each of them"
