            isVariadic: true
            description: "mise flags to embed in the generated hook, given after --"
        options:
          - name: ["-t", "--task"]
            description: "The task to run when the hook is triggered"
            args:
              name: "task"
              generators:
                script: "mise tasks ls --complete"
                descriptionSeparator: ":"
          - name: ["-w", "--write"]
            description: "Write the hook to the hooks directory and make it executable"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "github-action"
        description: "Generate a GitHub Actions workflow that runs a mise task"
        options:
          - name: ["-t", "--task"]
            description: "The task to run when the workflow is triggered"
            args:
              name: "task"
              generators:
                script: "mise tasks ls --complete"
                descriptionSeparator: ":"
          - name: ["-w", "--write"]
            description: "Write the workflow to .github/workflows/<NAME>.yml instead of printing it"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "install-script"
        description: "Generate a script that downloads and runs a pinned mise"
        options:
          - name: ["-l", "--localize"]
            description: "Keep mise data and cache in a project-local directory (.mise by default)"
          - name: ["-V", "--version"]
            description: "mise version to pin; defaults to the release mise self-update would install"
            args:
              name: "version"
          - name: ["-w", "--write"]
            description: "Write the script to PATH (./bin/mise when no path is given) and make it executable, instead of printing it"
            args:
              name: "path"
              isOptional: true
              template: folders
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "task-docs"
        description: "Generate Markdown documentation for project tasks"
        options:
          - name: ["-i", "--inject"]
            description: "Replace the marked section of the --output file"
          - name: ["-I", "--index"]
            description: "Write only an index of tasks, intended for use with --multi"
          - name: ["-m", "--multi"]
            description: "Render each task as a separate document; requires --output to be a directory"
          - name: ["-o", "--output"]
            description: "Write the generated docs to a file or directory"
            args:
              name: "path"
              template: folders
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "task-stubs"
        description: "Generate scripts that run mise tasks"
        options:
          - name: ["-d", "--dir"]
            description: "Directory to create task stubs inside of"
            args:
              name: "dir"
              template: folders
          - name: ["-m", "--mise-bin"]
            description: "mise executable the stubs run; defaults to mise from PATH"
            args:
              name: "path"
              template: folders
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "tool-stub"
        description: "Generate or update a tool stub"
        args:
          - name: "output"
            description: "Output file path for the tool stub"
        options:
          - name: ["-b", "--bin"]
            description: "Binary path within the extracted archive"
            args:
              name: "bin"
          - name: ["-u", "--url"]
            description: "URL to download the tool from"
            args:
              name: "url"
          - name: ["-h", "--help"]
            description: "Print help"
  - name: "implode"
