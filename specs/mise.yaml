  - name: ["tasks", "t"]
    description: "Manage tasks"
    args:
      - name: "task"
        isOptional: true
        description: "Task to show, as mise tasks info does"
        generators:
          script: "mise tasks ls --complete"
          descriptionSeparator: ":"
    options:
      - name: ["-g", "--global"]
        description: "Only show global tasks"
      - name: ["-J", "--json"]
        description: "Output in JSON format"
      - name: ["-l", "--local"]
        description: "Deprecated alias for --no-global"
      - name: ["-x", "--extended"]
        description: "Show all columns"
      - name: ["-a", "--all"]
        description: "Include tasks from every project in the monorepo, not only the current directory's hierarchy"
      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: "add"
        description: "Add a task"
        args:
          - name: "task"
            description: "Name of the task to add"
            generators:
              script: "mise tasks ls --complete"
              descriptionSeparator: ":"
          - name: "value"
            isVariadic: true
            description: "Command to run, given after --"
        options:
          - name: ["-f", "--file"]
            description: "Create a file task instead of a TOML task"
          - name: ["-F", "--force"]
            description: "Replace a task that already has this name in the file"
          - name: ["-n", "--dry-run"]
            description: "Show what would be written without writing it"
          - name: ["-J", "--json"]
            description: "Print what was written as JSON"
          - name: ["-e", "--env"]
            description: "Use mise.<ENV>.toml in the current directory, or .mise.<ENV>.toml if that exists"
            args:
              name: "env"
          - name: ["-g", "--global"]
            description: "Use the global config file"
          - name: ["-p", "--path"]
            description: "Use this config file, or the config file in this directory"
            args:
              name: "path"
              template: folders
          - name: ["-a", "--alias"]
            description: "Other names for the task"
            isRepeatable: true
            args:
              name: "alias"
          - name: ["-d", "--depends"]
            description: "Tasks to run before this one"
            isRepeatable: true
            args:
              name: "task"
              generators:
                script: "mise tasks ls --complete"
                descriptionSeparator: ":"
          - name: ["-D", "--dir"]
            description: "Run the task in a specific directory"
            args:
              name: "dir"
              template: folders
          - name: ["-H", "--hide"]
            description: "Hide the task from mise tasks and completions"
          - name: ["-q", "--quiet"]
            description: "Do not print the command before running"
          - name: ["-r", "--raw"]
            description: "Connect the task directly to the terminal's stdin, stdout, and stderr"
          - name: ["-s", "--sources"]
            description: "Glob patterns of files this task uses as input"
            isRepeatable: true
            args:
              name: "glob"
          - name: ["-w", "--wait-for"]
            description: "Wait for these tasks to finish if they are also being run"
            isRepeatable: true
            args:
              name: "task"
              generators:
                script: "mise tasks ls --complete"
                descriptionSeparator: ":"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "deps"
        description: "Show the dependency tree of tasks"
        args:
          - name: "tasks"
            isOptional: true
            isVariadic: true
            description: "Tasks to show (default: all tasks)"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "edit"
        description: "Open a task in your editor"
