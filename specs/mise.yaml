          - name: ["-f", "--file", "--path"]
            description: "Config file to edit, or a directory whose config file to edit"
            args:
              name: "file"
              template: filepaths
          - name: ["-g", "--global"]
            description: "Edit the global config file"
          - name: ["-t", "--type"]
            description: "TOML type to store the value as; inferred from the value by default"
