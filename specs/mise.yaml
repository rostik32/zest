        description: "Print help"
  - name: "lock"
    description: "Create or refresh lockfile versions, checksums, and download URLs"
    args:
      - name: "tool"
        isOptional: true
        isVariadic: true
        description: "Tools to lock, such as node python; defaults to every configured tool and every tool a task needs"
    options:
      - name: ["-g", "--global"]
        description: "Lock only the global and system config lockfiles"
      - name: ["-j", "--jobs"]
        description: "How many jobs to run in parallel; defaults to the jobs setting"
        args:
          name: "jobs"
      - name: ["-n", "--dry-run"]
        description: "Show what would change, without writing anything"
      - name: ["-p", "--platform"]
