          - name: "host"
            isOptional: true
            description: "Forgejo hostname"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "github"
        description: "Show the GitHub token mise uses for a host"
        args:
          - name: "host"
            isOptional: true
            description: "GitHub hostname"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "gitlab"
        description: "Show the GitLab token mise uses for a host"
        args:
          - name: "host"
            isOptional: true
            description: "GitLab hostname"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
  - name: "tool"
    description: "Show information about a tool"
    args:
      - name: "tool"
        description: "The tool, such as node or aqua:jqlang/jq"
    options:
      - name: ["-J", "--json"]
        description: "Output in JSON format"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: "tool-stub"
    description: "Run a tool stub file"
    args:
      - name: "file"
        description: "Path to the TOML tool stub file to execute"
        template: filepaths
      - name: "args"
        isOptional: true
        isVariadic: true
        description: "Arguments to pass to the tool"
  - name: "trust"
    description: "Mark a config file as trusted"
    args:
      - name: "config_file"
        isOptional: true
        description: "The config file whose trust status to change"
        template: filepaths
    options:
      - name: ["-a", "--all"]
        description: "Trust all config files in the current directory, its parents, and its subdirectories"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: "uninstall"
    description: "Remove installed tool versions"
    args:
      - name: "installed_tool@version"
        isOptional: true
        isVariadic: true
        description: "Tools to remove, such as node@22.0.0"
        generators:
          script: "mise ls -i | awk '{print $1}' | uniq"
    options:
      - name: ["-a", "--all"]
        description: "Remove every installed version of the named tools, or of every tool when none is named"
      - name: ["-n", "--dry-run"]
        description: "Show what would change without changing anything"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: "unset"
    description: "Remove environment variables from mise.toml"
    args:
      - name: "env_key"
        isOptional: true
        isVariadic: true
        description: "Environment variables to remove, such as NODE_ENV"
        generators:
          script: "mise set --complete"
    options:
      - name: ["-f", "--file", "--path"]
        description: "The TOML file to edit instead of the default target"
        args:
          name: "file"
          template: filepaths
      - name: ["-g", "--global"]
        description: "Use the global config file"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: "untrust"
    description: "Remove explicit trust for a config"
    args:
      - name: "config_file"
        isOptional: true
        description: "The config file to untrust"
        template: filepaths
    options:
      - name: ["-h", "--help"]
        description: "Print help"
  - name: ["unuse", "rm"]
    description: "Remove tool requests from config files and prune unused installations"
    args:
      - name: "installed_tool@version"
        isVariadic: true
        description: "Tools to remove from the config, with the version written as in the config"
        generators:
          script: "mise ls -i | awk '{print $1}' | uniq"
    options:
      - name: ["-e", "--env"]
        description: "Edit mise.<ENV>.toml in the current directory, or .mise.<ENV>.toml if that exists"
        args:
          name: "env"
      - name: ["-g", "--global"]
        description: "Use the global config file (~/.config/mise/config.toml) instead of the local one"
      - name: ["-p", "--path", "--file"]
        description: "Edit this config file, or the config file in this directory"
        args:
          name: "path"
          template: folders
      - name: ["-h", "--help"]
        description: "Print help"
  - name: ["upgrade", "up"]
    description: "Upgrade outdated tools"
    args:
      - name: "installed_tool@version"
        isOptional: true
        isVariadic: true
        description: "Tools to upgrade, such as node@20 python@3.10"
        generators:
          script: "mise ls -i | awk '{print $1}' | uniq"
    options:
      - name: ["-b", "--bump"]
        description: "Upgrade past the configured range to the newest release, and update the config to match"
      - name: ["-i", "--interactive"]
        description: "Choose which tools to upgrade from a multiselect menu"
      - name: ["-j", "--jobs"]
        description: "Number of jobs to run in parallel (default: the jobs setting)"
        args:
          name: "jobs"
      - name: ["-n", "--dry-run"]
        description: "Show what would change without changing anything"
      - name: ["-x", "--exclude"]
        description: "Tools to exclude from upgrading, such as go python"
        isRepeatable: true
        args:
          name: "installed_tool"
          generators:
            script: "mise ls -i | awk '{print $1}' | uniq"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: ["use", "u"]
    description: "Install a tool and add it to configuration"
    options:
      - name: ["-e", "--env"]
        description: "Write mise.<ENV>.toml in the current directory, or .mise.<ENV>.toml if that exists"
        args:
          name: "env"
      - name: ["-f", "--force"]
        description: "Reinstall even if already installed"
      - name: ["-g", "--global"]
        description: "Write to the global config instead of the project config"
      - name: ["-j", "--jobs"]
        description: "Number of jobs to run in parallel (default: the jobs setting)"
        args:
          name: "jobs"
      - name: ["-n", "--dry-run"]
        description: "Show what would change without changing anything"
      - name: ["-p", "--path"]
        description: "Write to this config file, or to the config file in this directory"
        args:
          name: "path"
          template: folders
      - name: ["-h", "--help"]
        description: "Print help"
  - name: "vars"
    description: "List, set, and ask for config vars"
    args:
      - name: "name[=value"
        isOptional: true
        isVariadic: true
        description: "Values to save (NAME=VALUE) or to print (NAME)"
    options:
      - name: ["-J", "--json"]
        description: "Output in JSON format"
      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: ["ls", "list"]
        description: "List every var, with the file it comes from"
        options:
          - name: ["-J", "--json"]
            description: "Output in JSON format"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "prompt"
        description: "Ask for the prompt vars that have no saved answer, or set answers directly"
        args:
          - name: "name[=value"
            isOptional: true
            isVariadic: true
            description: "Vars to ask for (NAME) or answers to save (NAME=VALUE)"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: ["unset", "rm"]
        description: "Forget saved answers so they are asked for again"
        args:
          - name: "name"
            isOptional: true
            isVariadic: true
            description: "The vars whose answers to forget"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
  - name: ["version", "v"]
    description: "Show the version of mise"
    options:
      - name: ["-J", "--json"]
        description: "Print the version information in JSON format"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: ["watch", "w"]
    description: "Run tasks and rerun them when files change"
    args:
      - name: "task"
        isOptional: true
        description: "Task to watch (default: default); separate several tasks with :::"
        generators:
          script: "mise tasks ls --complete"
          descriptionSeparator: ":"
      - name: "args"
        isOptional: true
        isVariadic: true
        description: "Arguments for the task; ::: starts the next task"
    options:
      - name: ["-g", "--glob"]
        description: "Globs to watch instead of the tasks' sources"
        isRepeatable: true
        args:
          name: "glob"
      - name: ["-w", "--watch"]
        description: "Watch a file or directory"
        isRepeatable: true
        args:
          name: "path"
          template: folders
      - name: ["-W", "--watch-non-recursive"]
        description: "Watch a directory without recursing into it"
        isRepeatable: true
        args:
          name: "path"
