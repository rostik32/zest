        args:
          - name: "path"
            isOptional: true
            isVariadic: true
            description: "Only inspect these conflicted paths"
            template: folders
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "diff"
        description: "Show what mise dot apply would change"
