      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: "add"
        description: "Start deploying a file, or copy its edits back to the source"
        args:
          - name: "target"
            isOptional: true
            isVariadic: true
            description: "Targets to add or update"
        options:
          - name: ["-f", "--force"]
            description: "Overwrite existing sources without prompting"
          - name: ["-g", "--global"]
            description: "Write to the global config (the default)"
          - name: ["-l", "--local"]
            description: "Write to the project config instead of the global config"
          - name: ["-m", "--mode"]
            description: "Mode for a target that is not managed yet: symlink, symlink-each, copy, or template (default: the dotfiles.default_mode setting)"
            args:
              name: "mode"
          - name: ["-n", "--dry-run"]
            description: "Print the config and source changes without writing anything"
          - name: ["-p", "--path"]
            description: "Write to this config file or directory"
            args:
              name: "path"
              template: folders
          - name: ["-s", "--source"]
            description: "Source path to use for a single target"
            args:
              name: "path"
              template: folders
          - name: ["-y", "--yes"]
            description: "Skip the confirmation prompt"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "apply"
        description: "Link, copy, and render [dotfiles] entries into place"
        args:
          - name: "target"
            isOptional: true
            isVariadic: true
            description: "Only apply these targets"
        options:
          - name: ["-f", "--force"]
            description: "Overwrite existing files that conflict with whole-file dotfile entries"
          - name: ["-n", "--dry-run"]
            description: "Print the actions that would run without writing anything"
          - name: ["-y", "--yes"]
            description: "Skip the confirmation prompt"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "capture"
