        args:
          - name: "setting"
            description: "The setting to set"
            generators:
              script: "mise settings --complete"
              descriptionSeparator: ":"
          - name: "value"
            isOptional: true
            description: "The value to set (or pass SETTING=VALUE)"
        options:
          - name: ["-l", "--local"]
            description: "Write to the nearest project config instead of the global config"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: ["unset", "rm"]
        description: "Remove a setting from the global or project config"
        args:
          - name: "key"
            description: "The setting to remove"
        options:
          - name: ["-l", "--local"]
            description: "Write to the nearest project config instead of the global config"
          - name: ["-h", "--help"]
            description: "Print help"
  - name: ["shell", "sh"]
