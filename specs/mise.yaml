      - name: "set"
        description: "Change fields of an existing TOML task"
        args:
          - name: "task"
            description: "Name of the task to change"
            generators:
              script: "mise tasks ls --complete"
              descriptionSeparator: ":"
          - name: "value"
            isVariadic: true
            description: "Command to run instead of the current one, given after --"
        options:
          - name: ["-n", "--dry-run"]
            description: "Show what would be written without writing it"
          - name: ["-J", "--json"]
            description: "Print what was written as JSON"
          - name: ["-u", "--unset"]
            description: "Remove this field from the task; repeat for several"
            isRepeatable: true
            args:
              name: "field"
          - name: ["-e", "--env"]
            description: "Use mise.<ENV>.toml in the current directory, or .mise.<ENV>.toml if that exists"
            args:
              name: "env"
          - name: ["-g", "--global"]
            description: "Use the global config file"
          - name: ["-p", "--path"]
            description: "Use this config file, or the config file in this directory"
            args:
              name: "path"
              template: folders
          - name: ["-a", "--alias"]
            description: "Other names for the task"
            isRepeatable: true
            args:
              name: "alias"
          - name: ["-d", "--depends"]
            description: "Tasks to run before this one"
            isRepeatable: true
            args:
              name: "task"
              generators:
                script: "mise tasks ls --complete"
                descriptionSeparator: ":"
          - name: ["-D", "--dir"]
            description: "Run the task in a specific directory"
            args:
              name: "dir"
              template: folders
          - name: ["-H", "--hide"]
            description: "Hide the task from mise tasks and completions"
          - name: ["-q", "--quiet"]
            description: "Do not print the command before running"
          - name: ["-r", "--raw"]
            description: "Connect the task directly to the terminal's stdin, stdout, and stderr"
          - name: ["-s", "--sources"]
            description: "Glob patterns of files this task uses as input"
            isRepeatable: true
            args:
              name: "glob"
          - name: ["-w", "--wait-for"]
            description: "Wait for these tasks to finish if they are also being run"
            isRepeatable: true
            args:
              name: "task"
              generators:
                script: "mise tasks ls --complete"
                descriptionSeparator: ":"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "validate"
        description: "Check task definitions for errors"
        args:
          - name: "tasks"
            isOptional: true
            isVariadic: true
            description: "Tasks to validate (default: all tasks)"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
  - name: "test-tool"
    description: "Test that a tool installs and runs"
    args:
      - name: "tools"
        isOptional: true
        isVariadic: true
        description: "Tools to test"
    options:
      - name: ["-a", "--all"]
        description: "Test every registry tool that defines a test and supports this OS"
      - name: ["-j", "--jobs"]
        description: "Number of tools to test in parallel (default 4)"
        args:
          name: "jobs"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: "token"
    description: "Show which Git provider token mise uses"
    options:
      - name: ["-h", "--help"]
