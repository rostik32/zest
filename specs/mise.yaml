# yaml-language-server: $schema=https://raw.githubusercontent.com/rostik32/zest/main/schema/spec.schema.json
# mise. Generated from mise.usage.kdl (the CLI's usage spec) in github.com/jdx/mise.
name: mise
description: Dev tools, env vars and tasks in one CLI
args:
  - name: "task"
    isOptional: true
    description: "Task to run"
    generators:
      script: "mise tasks ls --complete"
      descriptionSeparator: ":"
options:
  - name: ["-C", "--cd"]
    description: "Run as if mise were started in DIR"
    args:
      name: "dir"
      template: folders
  - name: ["-E", "--env"]
    description: "Load the mise.<ENV>.toml config files (same as MISE_ENV)"
    isRepeatable: true
    args:
      name: "env"
  - name: ["-j", "--jobs"]
    description: "How many jobs to run in parallel; defaults to the jobs setting"
    args:
      name: "jobs"
  - name: ["-q", "--quiet"]
    description: "Suppress non-error messages"
  - name: ["-v", "--verbose"]
    description: "Show extra output (use -vv for even more)"
    isRepeatable: true
  - name: ["-y", "--yes"]
    description: "Answer yes to all confirmation prompts"
  - name: ["-h", "--help"]
    description: "Print help"
subcommands:
  - name: "activate"
    description: "Print the script to activate mise in an interactive shell"
    args:
      - name: "shell_type"
        isOptional: true
        description: "Shell type to generate the script for"
    options:
      - name: ["-q", "--quiet"]
        description: "Suppress non-error messages from the hook that runs at each prompt"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: ["tool-alias", "alias"]
    description: "Manage tool backend and version aliases"
    options:
      - name: ["-p", "--tool"]
        description: "Filter aliases by tool"
        args:
          name: "tool"
      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: "get"
        description: "Show the version a tool's version alias stands for"
        args:
          - name: "tool"
            description: "The tool to show the alias for"
          - name: "alias"
            description: "The alias to show"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: ["ls", "list"]
        description: "List tool version aliases"
        args:
          - name: "tool"
            isOptional: true
            description: "Only show aliases for this tool"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: ["set", "add"]
        description: "Set a backend alias or a version alias in the global config"
        args:
          - name: "tool"
            description: "The tool to alias"
          - name: "alias"
            description: "The version alias to set, or the backend when VALUE is omitted"
          - name: "value"
            isOptional: true
            description: "The version request the alias stands for"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: ["unset", "rm"]
        description: "Remove a backend alias or a version alias from the global config"
        args:
          - name: "tool"
            description: "The tool to remove the alias from"
          - name: "alias"
            isOptional: true
            description: "The version alias to remove; omit it to remove the backend alias"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
  - name: ["backends", "b"]
    description: "Manage backends"
    options:
      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: ["ls", "list"]
        description: "List built-in backends"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "switch"
        description: "Switch tools to the backend the registry now installs them from"
        args:
          - name: "tool@version"
            isOptional: true
            isVariadic: true
            description: "Tools to switch"
        options:
          - name: ["-n", "--dry-run"]
            description: "Show what would switch without changing the lockfile or installs"
          - name: ["-g", "--global"]
            description: "Switch tools in the global config's lockfile instead of the project's"
          - name: ["-h", "--help"]
            description: "Print help"
  - name: "bin-paths"
    description: "List the bin directories of the active tools"
    args:
      - name: "tool@version"
        isOptional: true
        isVariadic: true
        description: "Only list these tools, such as ruby@3"
    options:
      - name: ["-J", "--json"]
        description: "Print executables as JSON objects with name, path, and symlink (implies --bin-names)"
      - name: ["-h", "--help"]
        description: "Print help"
  - name: ["bootstrap", "bs"]
    description: "Set up this machine from your mise config"
    options:
      - name: ["-n", "--dry-run"]
        description: "Show what would change without changing anything"
      - name: ["-y", "--yes"]
        description: "Skip confirmation prompts"
      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: "accounts"
        description: "Manage Linux users and groups"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Create, update, or remove the configured Linux users and groups"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of the configured Linux users and groups"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "compose"
        description: "Manage Docker Compose projects from [bootstrap.compose]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Apply Docker Compose projects from [bootstrap.compose]"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of Docker Compose projects from [bootstrap.compose]"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "files"
        description: "Manage system files and directories declared in [bootstrap]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Create, update, or remove the configured system files and directories"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of the configured system files and directories"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "firewall"
        description: "Manage the Linux host firewall from [bootstrap.linux.firewall]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Apply the firewall from [bootstrap.linux.firewall]"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of the firewall from [bootstrap.linux.firewall]"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "linux"
        description: "Manage systemd user units from [bootstrap.linux.systemd.units]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: ["systemd-units", "systemd"]
            description: "Manage systemd user units from [bootstrap.linux.systemd.units]"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
            subcommands:
              - name: "apply"
                description: "Install and start the configured systemd user units"
                options:
                  - name: ["-n", "--dry-run"]
                    description: "Show what would change without changing anything"
                  - name: ["-y", "--yes"]
                    description: "Skip the confirmation prompt"
                  - name: ["-h", "--help"]
                    description: "Print help"
              - name: "status"
                description: "Show the state of the configured systemd user units"
                options:
                  - name: ["-J", "--json"]
                    description: "Output in JSON format"
                  - name: ["-h", "--help"]
                    description: "Print help"
      - name: "macos"
        description: "Manage macOS preferences and LaunchAgents from [bootstrap.settings.macos] and [bootstrap.macos.launchd]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "defaults"
            description: "Manage macOS preferences such as Dock, Finder, and keyboard settings"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
            subcommands:
              - name: "apply"
                description: "Write the configured macOS preferences"
                options:
                  - name: ["-n", "--dry-run"]
                    description: "Show what would change without changing anything"
                  - name: ["-y", "--yes"]
                    description: "Skip the confirmation prompt"
                  - name: ["-h", "--help"]
                    description: "Print help"
              - name: "status"
                description: "Show the state of the configured macOS preferences"
                options:
                  - name: ["-J", "--json"]
                    description: "Output in JSON format"
                  - name: ["-h", "--help"]
                    description: "Print help"
          - name: ["launchd-agents", "launchd"]
            description: "Manage macOS LaunchAgents from [bootstrap.macos.launchd.agents]"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
            subcommands:
              - name: "apply"
                description: "Install and load LaunchAgents from [bootstrap.macos.launchd.agents]"
                options:
                  - name: ["-n", "--dry-run"]
                    description: "Show what would change without changing anything"
                  - name: ["-y", "--yes"]
                    description: "Skip the confirmation prompt"
                  - name: ["-h", "--help"]
                    description: "Print help"
              - name: "status"
                description: "Show the state of the configured LaunchAgents"
                options:
                  - name: ["-J", "--json"]
                    description: "Output in JSON format"
                  - name: ["-h", "--help"]
                    description: "Print help"
      - name: ["mise-shell-activate", "shell"]
        description: "Manage mise shell activation from [bootstrap.mise_shell_activate]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Write mise activation into the configured shell startup files"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of the configured shell activation"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "packages"
        description: "Manage packages from [bootstrap.packages]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: ["apply", "i"]
            description: "Install or remove packages to match [bootstrap.packages]"
            args:
              - name: "package"
                isOptional: true
                isVariadic: true
                description: "Packages as manager:package; defaults to every package in [bootstrap.packages]"
            options:
              - name: ["-m", "--manager"]
                description: "Only apply packages for this built-in or plugin manager"
                args:
                  name: "manager"
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "brew"
            description: "Manage Homebrew tap URLs in [bootstrap.brew.taps]"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
            subcommands:
              - name: "tap"
                description: "Add a Homebrew tap URL to the global [bootstrap.brew.taps]"
                args:
                  - name: "tap"
                    description: "Tap name, e.g"
                  - name: "url"
                    isOptional: true
                    description: "GitHub URL of the tap; defaults to https://github.com/<owner>/homebrew-<repo>.git"
                options:
                  - name: ["-l", "--local"]
                    description: "Write to the local config instead of the global config"
                  - name: ["-n", "--dry-run"]
                    description: "Show the config change without writing it"
                  - name: ["-p", "--path", "--file"]
                    description: "Write to this config file or directory"
                    args:
                      name: "path"
                      template: folders
                  - name: ["-h", "--help"]
                    description: "Print help"
              - name: ["untap", "remove"]
                description: "Remove Homebrew tap URLs from [bootstrap.brew.taps]"
                args:
                  - name: "taps"
                    isVariadic: true
                    description: "Tap names, e.g"
                options:
                  - name: ["-l", "--local"]
                    description: "Write to the local config instead of the global config"
                  - name: ["-n", "--dry-run"]
                    description: "Show the config change without writing it"
                  - name: ["-p", "--path", "--file"]
                    description: "Write to this config file or directory"
                    args:
                      name: "path"
                      template: folders
                  - name: ["-h", "--help"]
                    description: "Print help"
          - name: "export"
            description: "Print the configured nix: packages as a NixOS module"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "import"
            description: "Record installed Homebrew formulae in [bootstrap.packages]"
            options:
              - name: ["-e", "--env"]
                description: "Write to the config file for this environment (mise.<ENV>.toml)"
                args:
                  name: "env"
              - name: ["-g", "--global"]
                description: "Write to the global config (~/.config/mise/config.toml)"
              - name: ["-m", "--manager"]
                description: "Package manager to import from"
                args:
                  name: "manager"
              - name: ["-n", "--dry-run"]
                description: "Show the entries that would be written without writing them"
              - name: ["-p", "--path", "--file"]
                description: "Write to this config file or directory"
                args:
                  name: "path"
                  template: folders
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "prune"
            description: "Uninstall packages that no config declares"
            options:
              - name: ["-m", "--manager"]
                description: "Package manager to prune: brew, brew-cask, or a package plugin"
                args:
                  name: "manager"
              - name: ["-n", "--dry-run"]
                description: "Show what would be removed without removing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: ["status", "ls"]
            description: "Show the state of packages from [bootstrap.packages]"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: ["upgrade", "up"]
            description: "Upgrade installed packages from [bootstrap.packages]"
            args:
              - name: "package"
                isOptional: true
                isVariadic: true
                description: "Packages as manager:package; defaults to every package in [bootstrap.packages]"
            options:
              - name: ["-m", "--manager"]
                description: "Only upgrade packages for this built-in or plugin manager"
                args:
                  name: "manager"
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: ["use", "u"]
            description: "Add packages to [bootstrap.packages] and install them"
            args:
              - name: "package"
                isVariadic: true
                description: "Packages in manager:package[@version] form"
            options:
              - name: ["-e", "--env"]
                description: "Write to the config file for this environment (mise.<ENV>.toml)"
                args:
                  name: "env"
              - name: ["-g", "--global"]
                description: "Write to the global config (~/.config/mise/config.toml) instead of the local one"
              - name: ["-n", "--dry-run"]
                description: "Show what would change without writing config or installing"
              - name: ["-p", "--path", "--file"]
                description: "Write to this config file or directory"
                args:
                  name: "path"
                  template: folders
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "where"
            description: "Print the opt path of an installed Homebrew formula"
            args:
              - name: "package"
                description: "Formula to locate, as brew:<formula> or brew:<owner>/<tap>/<formula>"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "plan"
        description: "Show what applying bootstrap resources would change"
        options:
          - name: ["-J", "--json"]
            description: "Output a stable machine-readable plan in JSON format"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "plugins"
        description: "Manage package manager plugins declared in [bootstrap.plugins]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Install package manager plugins declared in [bootstrap.plugins]"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show which plugins would be installed without installing them"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show whether declared package manager plugins are installed"
            options:
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "remote"
        description: "Bootstrap one or more machines over SSH"
        args:
          - name: "target"
            isOptional: true
            isVariadic: true
            description: "Inventory host names from [bootstrap.remote.hosts]"
        options:
          - name: ["-i", "--identity-file"]
            description: "SSH identity file, overriding the inventory and SSH config"
            args:
              name: "path"
              template: folders
          - name: ["-n", "--dry-run"]
            description: "Show what would change on each target without changing it"
          - name: ["-y", "--yes"]
            description: "Skip confirmation prompts on each target"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "repos"
        description: "Manage Git repositories from [bootstrap.repos]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Clone missing Git repositories and check out configured refs"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "exec"
            description: "Run a command in each configured Git repository"
            args:
              - name: "path"
                isOptional: true
                isVariadic: true
                description: "Run only in repositories at these paths, as written in config or expanded"
                template: folders
              - name: "value"
                isVariadic: true
                description: "Command and arguments to run in each repository"
            options:
              - name: ["-c", "--continue-on-error"]
                description: "Continue running in other repositories after a command fails"
              - name: ["-n", "--dry-run"]
                description: "Print the commands that would run without running them"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of Git repositories from [bootstrap.repos]"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "update"
            description: "Clone missing Git repositories and fast-forward the rest"
            args:
              - name: "path"
                isOptional: true
                isVariadic: true
                description: "Only update repositories at these paths, as written in config or expanded (for example ~/src/mise)"
                template: folders
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "secrets"
        description: "Inspect bootstrap secret inputs without revealing their values"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "status"
            description: "Show whether declared bootstrap secret inputs are available"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "services"
        description: "Manage services from [bootstrap.services]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Apply the service state declared in [bootstrap.services]"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "remove"
            description: "Uninstall a user-scope service"
            args:
              - name: "name"
                description: "Name of the installed user service"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would be removed without removing it"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show the state of services from [bootstrap.services]"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: "settings"
        description: "[experimental] Apply [bootstrap.settings] through bootstrap settings plugins"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Write the settings that differ from [bootstrap.settings]"
            args:
              - name: "plugin"
                isOptional: true
                isVariadic: true
                description: "Plugins whose sections to apply; all of them by default"
                generators:
                  script: "mise plugins --core --user"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show which settings would change without changing them"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show each setting in [bootstrap.settings] and its current value"
            args:
              - name: "plugin"
                isOptional: true
                isVariadic: true
                description: "Plugins whose sections to show; all of them by default"
                generators:
                  script: "mise plugins --core --user"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
      - name: ["status", "ls"]
        description: "Show the state of every configured bootstrap part"
        options:
          - name: ["-J", "--json"]
            description: "Output in JSON format"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "unapply"
        description: "Remove what a config environment's bootstrap sections created"
        args:
          - name: "env"
            isVariadic: true
            description: "Config environments whose resources should be removed"
        options:
          - name: ["-f", "--force"]
            description: "Remove targets that changed since they were applied"
          - name: ["-n", "--dry-run"]
            description: "Show what would be removed without removing anything"
          - name: ["-y", "--yes"]
            description: "Skip the confirmation prompt"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "user"
        description: "Manage your login shell from [bootstrap.user]"
        options:
          - name: ["-h", "--help"]
            description: "Print help"
        subcommands:
          - name: "apply"
            description: "Set your login shell from [bootstrap.user]"
            options:
              - name: ["-n", "--dry-run"]
                description: "Show what would change without changing anything"
              - name: ["-y", "--yes"]
                description: "Skip the confirmation prompt"
              - name: ["-h", "--help"]
                description: "Print help"
          - name: "status"
            description: "Show whether your login shell matches [bootstrap.user]"
            options:
              - name: ["-J", "--json"]
                description: "Output in JSON format"
              - name: ["-h", "--help"]
                description: "Print help"
  - name: "cache"
    description: "Manage the mise cache"
    options:
      - name: ["-h", "--help"]
        description: "Print help"
    subcommands:
      - name: ["clear", "c"]
