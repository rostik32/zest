            description: "Mode to use if the target is not managed yet: symlink, symlink-each, copy, or template (default: the dotfiles.default_mode setting)"
            args:
              name: "mode"
          - name: ["-s", "--source"]
            description: "Source path to use if the target is not yet managed"
            args:
              name: "path"
              template: folders
          - name: ["-y", "--yes"]
            description: "Skip the confirmation prompt when adding an unmanaged target"
          - name: ["-h", "--help"]
            description: "Print help"
      - name: "exclude"
        description: "Never save paths matching a glob"
