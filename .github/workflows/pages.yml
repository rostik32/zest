name: Website

on:
  push:
    branches: [main]
    paths: [site/**, docs/images/**, assets/icon.png, assets/social-preview.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp site/* _site/
          cp docs/images/demo.gif docs/images/appearance.gif docs/images/hero.png assets/icon.png assets/social-preview.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
